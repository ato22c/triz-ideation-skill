<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A/B 블라인드 평가</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1c2230; --muted:#667085; --line:#dfe3ea;
  --a:#2563eb; --a-soft:#e8f0ff; --b:#d9480f; --b-soft:#fff0e8; --ok:#16794a; --ok-soft:#e6f6ee;
  --accent:#4f46e5; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131a; --card:#171b24; --ink:#e8ebf2; --muted:#98a2b3; --line:#2a3040;
    --a:#7aa2ff; --a-soft:#1b2744; --b:#ff9a6b; --b-soft:#3a2418; --ok:#5fd29a; --ok-soft:#123424;
    --accent:#8b86ff; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#10131a; --card:#171b24; --ink:#e8ebf2; --muted:#98a2b3; --line:#2a3040;
  --a:#7aa2ff; --a-soft:#1b2744; --b:#ff9a6b; --b-soft:#3a2418; --ok:#5fd29a; --ok-soft:#123424;
  --accent:#8b86ff; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.progress{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip.done::after{content:" ✓";color:var(--ok);font-weight:700}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;font-family:inherit}
.problem{margin:20px 0 14px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.problem small{color:var(--muted);display:block;margin-bottom:4px;font-size:12px;letter-spacing:.02em}
.problem p{margin:0;font-size:17px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.col>h2{margin:0;padding:10px 16px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.col.A>h2{background:var(--a-soft);color:var(--a)} .col.B>h2{background:var(--b-soft);color:var(--b)}
.col h2 span{font-size:12px;font-weight:400;opacity:.8}
.md{padding:6px 18px 18px;overflow-wrap:anywhere;font-size:15px}
.md h1,.md h2,.md h3,.md h4{line-height:1.35;margin:1.2em 0 .4em}
.md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15.5px}.md h4{font-size:15px}
.md ul,.md ol{padding-left:1.3em}.md li{margin:.2em 0}
.md code{background:color-mix(in srgb,var(--line) 60%,transparent);padding:.1em .35em;border-radius:5px;font-size:.92em}
.md pre{background:color-mix(in srgb,var(--line) 50%,transparent);padding:10px 12px;border-radius:8px;overflow:auto;white-space:pre-wrap}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;width:100%;font-size:13.5px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md blockquote{margin:.8em 0;padding:.1em 1em;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.eval{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.eval h3{margin:0 0 10px;font-size:16px}
.winner{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pick{flex:1;min-width:120px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.pick[data-v="A"][aria-pressed="true"]{border-color:var(--a);background:var(--a-soft);color:var(--a)}
.pick[data-v="B"][aria-pressed="true"]{border-color:var(--b);background:var(--b-soft);color:var(--b)}
.pick[data-v="tie"][aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.rtable{width:100%;border-collapse:collapse;margin:8px 0 14px}
.rtable th{font-weight:600;text-align:left;font-size:13px;color:var(--muted);padding:4px 6px}
.rtable td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.crit{font-size:14px}.crit small{display:block;color:var(--muted);font-size:12px}
.stars{display:flex;gap:4px}
.st{width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.st[aria-pressed="true"]{color:#fff;border-color:transparent}
.A-col .st[aria-pressed="true"]{background:var(--a)} .B-col .st[aria-pressed="true"]{background:var(--b)}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.result{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.result h2{margin:0 0 6px;font-size:18px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;line-height:1.2}.kpi span{color:var(--muted);font-size:13px}
.kpi.skill b{color:var(--ok)}
.rev{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.rev th,.rev td{border-top:1px solid var(--line);padding:7px 6px;text-align:left}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.badge.skill{background:var(--ok-soft);color:var(--ok)}.badge.base{background:var(--line);color:var(--muted)}
.saved{font-size:12px;color:var(--muted)}
.intro{margin:20px 0 0;padding:14px 18px;background:var(--card);border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.intro b{color:var(--ink)}
@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  .tabs-m{display:flex}
  .col.hidden-m{display:none}
}
.tabs-m{display:none;gap:8px;margin-bottom:10px;position:sticky;top:56px;z-index:10}
.tabs-m button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-family:inherit;font-size:15px}
.tabs-m button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.st:focus-visible,.pick:focus-visible,.btn:focus-visible,.chip:focus-visible,textarea:focus-visible,.tabs-m button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>A/B 블라인드 평가</h1>
  <div class="progress"><span id="pcount">0/0</span><div class="bar"><i id="pbar"></i></div><span class="saved" id="saved"></span></div>
  <div class="chips" id="chips"></div>
  <button class="theme" id="theme" type="button" aria-label="화면 밝기 전환">◐</button>
</div></header>

<main class="wrap">
  <div class="intro"><b>어떻게 하나요?</b> 문제마다 <b>답안 A</b>와 <b>답안 B</b>를 읽고, 더 도움이 되는 쪽을 고른 뒤 항목별 별점(1~5)을 매겨주세요.
  어느 쪽이 스킬을 쓴 답인지는 <b>모두 끝낸 뒤</b>에 공개됩니다. 답안은 기능·길이가 다를 수 있으니, 길이가 아니라 <b>내게 얼마나 쓸모 있었는지</b>로 판단해 주세요.
  입력은 이 브라우저에 자동 저장됩니다.</div>
  <div id="view"></div>
  <div id="result"></div>
</main>

<script id="data" type="application/json">[{"id": "D2", "domain": "소프트웨어", "problem": "저희 앱은 푸시 알림을 늘리면 재방문은 늘어나는데 알림을 아예 꺼버리는 사용자도 같이 늘어요. 알림을 줄이면 재방문이 떨어지고요. 새로운 접근법이 뭐가 있을까요?", "A": "핵심은 \"알림을 더 보낼까, 덜 보낼까\"라는 양의 문제로 보는 한, 어느 쪽을 택해도 한쪽 지표를 희생하게 된다는 점입니다. 모순을 피하는 게 아니라 **모순 자체를 해소하는 방향**으로 접근법을 바꿔야 합니다. (가정: 일반 소비자용 모바일 앱이고, OS 레벨의 알림 전체 차단이 \"꺼버리는\" 행동이라고 보겠습니다.)\n\n## 1. \"많이 vs 적게\"를 분리하기 — 조건별 분리\n\n**사람별로 분리**\n- 전체 평균 빈도를 조정하지 말고, 사용자마다 \"알림 피로 임계점\"을 추정해서 개인별 상한을 두세요. 신호: 알림 열람률 하락, 스와이프 삭제 속도, 앱 설정 화면 진입 등.\n- 꺼버리는 사용자는 대개 **끄기 직전에 전조 행동**을 보입니다. 이 시점을 감지하면 빈도를 자동으로 낮추는 \"서킷 브레이커\"를 두는 겁니다. 재방문이 안정적인 사용자에게는 오히려 더 보낼 수 있습니다.\n\n**시간별로 분리**\n- 같은 횟수라도 사용자가 실제로 앱을 여는 시간대 근처에 몰아 보내면 체감 피로가 줄어듭니다. \"하루 3회\"가 아니라 \"열 가능성이 높은 순간 1회\"로.\n\n**내용별로 분리**\n- 재방문을 만드는 알림과 짜증을 만드는 알림은 보통 다른 종류입니다. 알림마다 \"재방문 기여도 / 끄기 기여도\" 비율을 따로 측정하고, 후자가 높은 유형부터 없애세요. 총량은 유지하면서 구성만 바꾸는 겁니다.\n\n## 2. 끄기의 단위를 바꾸기 — 전부 아니면 전무를 없애기\n\n- 사용자가 OS에서 전체를 꺼버리는 이유는 **중간 선택지가 없기 때문**입니다. 앱 안에 \"이 종류만 끄기\", \"일주일 쉬기\", \"하루 1회로 줄이기\" 같은 단계를 두면 전체 차단으로 가는 비율이 줄어듭니다.\n- 알림 하나하나에 \"이런 알림 그만 받기\" 링크를 넣는 것도 같은 원리입니다. 불만을 OS 설정이 아니라 앱 안에서 해소하게 만드는 겁니다.\n- 안드로이드 알림 채널, iOS 임시 알림(Provisional) 같은 OS 기능을 활용하면 \"전부 끄기\" 대신 \"일부 끄기\"가 기본 경로가 됩니다.\n\n## 3. 알림 없이 재방문을 만드는 경로 찾기 — 알림 의존도 자체를 낮추기\n\n지금은 재방문의 유일한 지렛대가 알림이라서 모순이 생깁니다. 다른 지렛대를 만들면 알림 빈도를 줄여도 재방문이 유지됩니다.\n\n- **위젯 / 잠금화면 / 라이브 액티비티**: 알림처럼 끼어들지 않지만 앱 존재를 계속 노출합니다. 끄기 유발이 거의 없습니다.\n- **앱 안에 돌아올 이유 심기**: 진행 중인 상태(스트릭, 타이머, 미완료 작업 등)를 남겨두면 사용자가 스스로 돌아옵니다. 알림은 \"상기\"가 아니라 \"완결\"을 돕는 역할로만 씁니다.\n- **외부 채널 대체**: 이메일, 카톡 채널, 캘린더 연동 등 끄기 비용이 다른 채널로 일부 트래픽을 분산.\n\n## 4. 알림을 \"보내는 것\"에서 \"요청받는 것\"으로 — 역발상\n\n- 사용자가 직접 \"이거 알려줘\"라고 설정한 알림(가격 하락, 답글, 예약 시간 등)은 빈도가 높아도 거의 꺼지지 않습니다. 회사가 정한 마케팅 알림 비중을 줄이고, 사용자가 구독한 알림 비중을 늘리는 구조로 바꾸면 총량이 늘어도 끄기율은 안 오릅니다.\n- 온보딩에서 \"무엇을, 얼마나 자주 받을지\"를 고르게 하면, 사용자가 선택한 빈도에 대한 수용도가 훨씬 높습니다.\n\n## 5. 측정 지표를 바꾸기\n\n- 현재 두 지표(재방문율, 알림 차단율)를 따로 보기 때문에 트레이드오프처럼 보입니다. **\"알림 수신 허용 상태를 유지하면서 재방문한 사용자 수\"** 또는 \"알림 1건당 순 기대 LTV\"를 단일 목표로 잡으면, 빈도를 올릴지 내릴지가 사용자별로 자동으로 결정됩니다.\n- 끄는 사용자가 늘어나는 게 꼭 나쁜지도 확인해보세요. 끈 사용자가 어차피 이탈할 사람이었다면 손실이 아니고, 활성 사용자가 끈다면 심각한 신호입니다. 두 집단을 구분해야 올바른 결정이 나옵니다.\n\n## 우선순위 제안\n\n빠르게 효과를 볼 수 있는 순서로는:\n\n1. 알림 유형별 \"재방문 기여 / 끄기 기여\" 분석 → 나쁜 유형 제거 (데이터만 있으면 바로 가능)\n2. 앱 내 세분화된 알림 설정 + 알림 내 \"이 종류 끄기\" 링크 (전체 차단 분산)\n3. 끄기 전조 행동 감지 후 자동 감속 (개인화 상한)\n4. 위젯·사용자 구독형 알림 등 구조적 대체 (중장기)\n\n이 중 1·2번은 보통 2~4주 안에 실험 가능하고, 결과에 따라 3·4번의 투자 규모를 정하면 됩니다.", "B": "**먼저 \"사용자가 직접 주문한 알림만 보내는 버튼\"(②)을 한 화면에 붙여 보고, 동시에 \"안 열면 저절로 멈추고 앱을 열면 다시 켜지는 규칙\"(①)을 걸어 보세요. 이유는 두 안 모두 알림의 '횟수'가 아니라 '알림을 누가 원했나'를 바꿔서, 늘리면 꺼지고 줄이면 안 오는 시소에서 내려오기 때문입니다.**\n\n---\n\n### ① 안 열면 저절로 멈추고, 앱을 열면 다시 시작하는 알림\n- 뭘 하나: 보낸 알림이 연속 3개 열리지 않으면 그 사용자에게는 발송을 자동 중단한다. 사용자가 어떤 경로로든 앱을 열면 그 순간부터 발송이 재개된다. 쌓인 미열람 알림은 새 알림이 덮어쓴다(알림센터에 1개만 남게).\n- 왜 내 상황에 맞나: 추가 개발 거의 없이 발송 규칙만 바꾼다. 흔한 답 \"하루 N개 상한\"은 모두에게 같은 숫자를 강요하지만, 이 안은 **사용자의 무시가 스위치**가 되어 꺼버리기 직전의 사람에게만 알림이 멈춘다.\n- 안 통하는 조건: 알림을 안 열어도 앱은 잘 쓰는 사용자(알림 열기와 재방문이 따로 노는 서비스)에게는 멈춤이 오히려 손해.\n- 첫 실험: 그로스 담당 1명, 신규 가입자 절반에게 2주 적용 → 알림 끄기(OFF) 비율이 대조군 대비 20% 이상 낮고 7일 재방문이 5% 이상 안 떨어지면 전체 적용.\n\n### ② 사용자가 \"주문\"한 알림만 보낸다\n- 뭘 하나: 앱 안에서 사용자가 머무는 지점(장바구니, 보던 글, 미완료 작업, 가격·순위가 바뀌는 것)에 **\"이거 내일 아침에 알려줘 / 바뀌면 알려줘\" 버튼**을 둔다. 알림 문구에는 사용자가 그때 보던 제목·메모를 그대로 넣어 \"당신이 남긴 것\"임을 보이게 한다. 회사가 보내는 일방 알림은 주 1회 이하로 줄인다.\n- 왜 내 상황에 맞나: 가장 비슷한 흔한 답은 \"개인화 추천 알림\"이다. 다른 점은 **발신자가 사용자 자신**이라는 것. 추천은 아무리 잘 맞아도 \"회사가 보낸 광고\"로 분류되지만, 자기가 예약한 리마인더는 끄지 않는다. 기존 푸시 인프라에 예약 1개 추가하는 수준으로 시작 가능.\n- 안 통하는 조건: 사용자가 \"나중에 다시 보고 싶은 것\"이 앱 안에 거의 없을 때(일회성 도구 앱). 또는 버튼이 눈에 띄지 않아 주문 자체가 안 생길 때.\n- 첫 실험: 기획자 1명, 가장 체류가 긴 화면 1곳에 버튼만 수동 추가(발송은 운영자가 손으로) 1주 → 해당 화면 방문자의 5% 이상이 버튼을 누르고, 그 알림 열기율이 일반 알림의 2배를 넘으면 정식 개발.\n\n### ③ 밀어 보내지 말고, 늘 보이는 곳에 \"돌아올 이유\"를 둔다\n- 뭘 하나: 홈화면·잠금화면 위젯과 앱 아이콘 배지에 \"지금 돌아오면 볼 것\"(새 글 수, 바뀐 가격, 친구 활동)을 상시 표시한다. 위젯 설치는 앱 첫 사용 후 \"알림 대신 위젯으로 받기\"로 제안한다. 푸시는 사용자가 위젯을 안 깐 경우에만 유지.\n- 왜 내 상황에 맞나: 가장 비슷한 흔한 답은 \"채널 다변화(이메일·SMS)\"다. 다른 점은 **방해(소리·배너)가 아예 없어서 끌 이유가 생기지 않는다**는 것. 사용자가 폰을 볼 때마다 저절로 눈에 들어오므로 '횟수'라는 개념 자체가 없어진다. OS 기능이라 서버 비용이 없다.\n- 안 통하는 조건: 사용자가 위젯을 설치하는 비율이 낮을 때(보통 10% 안쪽). 콘텐츠가 자주 바뀌지 않아 위젯이 늘 같은 모습일 때.\n- 첫 실험: 디자이너 1명, 숫자 하나만 보이는 최소 위젯을 2주 배포 → 설치자 5% 이상, 설치자의 주간 재방문이 미설치자 대비 1.5배면 위젯 콘텍스트를 확장.\n\n### 와일드카드: 앱을 열라고 하지 않는 알림\n- 뭘 하나: 알림 자체에서 용건이 끝나게 만든다. \"오늘 잔액 32만 원\", \"당신 순위 12위(↑3)\", \"주문 도착 예정 15시\"처럼 **열지 않아도 가치가 전달되는 알림**만 보내고, '지금 확인하세요' 류 문구는 전부 없앤다. 더 알고 싶은 사람만 연다.\n- 왜 내 상황에 맞나: 가장 비슷한 흔한 답은 \"알림 카피 개선\"이다. 다른 점은 목표 자체를 **\"열게 만들기\"에서 \"알림이 유용하다는 신뢰 쌓기\"**로 바꾼다는 것. 광고가 아닌 '내 정보 전달'로 인식되면 끄지 않고, 끄지 않은 사용자에게 가끔 보내는 안내 알림의 효과가 커진다. 단기 재방문은 떨어질 수 있는 위험한 안이다.\n- 안 통하는 조건: 알림 열기율이 핵심 지표로 묶여 있는 조직. 또는 알림에 담을 \"사용자 개인 정보\"가 없는 서비스.\n- 첫 실험: 마케터 1명, 사용자 10%에게 2주간 '완결형' 알림만 발송 → 알림 OFF율이 절반 이하로 떨어지고, 4주 뒤 재방문이 대조군의 90% 이상 유지되면 확대. 알림 열기율 하락은 이 실험에서는 실패 기준으로 삼지 않는다.\n\n---\n\n**다음 행동**\n1. 이번 주: ①은 발송 규칙만 바꿔 신규 가입자 절반에 적용, ②는 체류 1위 화면에 버튼을 수동으로 붙여 1주 측정.\n2. 2주 뒤: ①②의 OFF율·재방문 숫자로 계속 여부 결정, 통과하면 ③ 위젯 최소 버전 착수.\n3. 결과가 애매하거나 \"제대로 파고들 문제\"라면, 40가지 방향을 모두 훑는 더 깊은 발상 한 번 더 해 볼지 알려 주세요.\n\n---\n\n**근거(짧게)**\n- 문제 재정의: \"사용자가 돌아올 이유가 있을 때 그것을 알게 되고 돌아온다\" → 한 단계 넓히면 \"사용자가 앱의 가치를 계속 받는다\"(③·와일드카드는 넓힌 목표에서 나옴).\n- 가정·제약: 기존 푸시 인프라 안에서, 큰 개발 없이, OFF율은 지금보다 높이지 않는 것이 조건이라고 가정. 빈도 조절은 이미 해본 것으로 보고 금지 목록에 넣음.\n- 기술적 모순(한쪽을 좋게 하면 다른 쪽이 나빠지는 쌍): 알림 횟수↑ → 재방문↑, 알림 유지율↓.\n- 물리적 모순(한 요소에 반대 성질이 동시에 요구됨): 알림은 많아야 한다(기억 환기) 동시에 적어야 한다(피로).\n- 연결: ①은 조건 분리(무시하면 0, 열면 많이) / ②는 조건 분리(사용자가 원한 것만 많이) / ③은 공간 분리(배너에는 0, 위젯에는 항상) / 와일드카드는 \"열게 한다\"는 전제 자체를 뒤집어 모순의 재방문 쪽을 재정의 — 직접 연결은 약함.\n- 점수(새로움/해볼 만함/효과): ① 2/5/4, ② 4/4/4, ③ 3/4/3, 와일드 4/3/?.\n\n**부록**\n- 무난한 답(금지 목록): 빈도 상한 · 최적 발송 시간 ML · 세그먼트별 빈도 · 콘텐츠 관련성 개선 · 알림 카테고리 설정 세분화 · 하루 1회 다이제스트 묶음 · 카피 A/B · 이메일/SMS 채널 추가.\n- 발산 아이디어(스윕 = 발명원리를 하나씩 문제에 대 보는 절차):\n  - [4 비대칭] 사용자가 고른 요일 하루에만 몰아 보내는 \"알림 요일제\"\n  - [31 다공질] 알림 없는 날의 빈틈을 배지·위젯 변화로 채움\n  - [24 매개체] 회사 대신 다른 사용자·친구가 남긴 것만 알림으로\n  - [33 동질성] 알림 문구를 사용자가 앱에서 쓴 말 그대로 사용\n  - [9 사전 반대조치] 가입 때 사용자가 스스로 \"알림 쿼터\"를 정하는 사전 약속\n  - [34 폐기와 재생] 미열람 알림은 새 알림이 덮어쓰고, 3개 무시 시 자동 멈춤·방문 시 재개\n  - [13 반대로 하기] 회사가 보내는 알림 → 사용자가 주문하는 알림 / 방문이 알림 1개를 \"충전\"\n  - [25 셀프서비스] SKIP(무시 횟수에 따른 자동 간격 조절은 금지 목록 '개인화 빈도'와 같은 메커니즘)\n  - [28 다른 채널] 위젯·잠금화면·아이콘 배지 등 끄기 동기가 없는 채널로 이동\n  - [32 색·투명도] 알림에 \"이번 주 남은 알림 2/3\" 예산을 투명하게 표시\n  - 극단화·거꾸로 하기: 끄기를 어렵게 → 뒤집어 \"1개월 알림 휴가(자동 재개)\"를 끄기보다 먼저 보이게\n  - 극단화·전제 뒤집기(\"알림은 열라고 보낸다\"): 열지 않아도 끝나는 완결형 알림\n  - 극단화·시간 0: 24시간 뒤 사라지는 알림(쌓이지 않음)\n- 다리 놓기: \"방문이 알림을 충전\" → ①의 재개 규칙으로 / \"친구가 보내는 알림\" → ②의 사용자 발신으로 / \"완결형 알림\" → 와일드카드."}, {"id": "H2", "domain": "AI 개발도구", "problem": "AI 코딩 에이전트가 큰 코드베이스에서 요청과 상관없는 파일을 자꾸 건드려요. 수정 가능한 범위를 좁게 제한하면 정작 필요한 수정도 못 해서 실패하고요. 새로운 해결 방식이 있을까요?", "A": "**먼저 \"건드릴 파일을 선언하고, 선언 밖 파일은 이유 한 줄을 쓰면 열리는\" 통행증 방식부터 해보세요. 범위를 막는 대신 \"설명 못 하는 수정\"만 막는 거라, 필요한 수정은 통과하고 무관한 수정은 스스로 걸러집니다.**\n\n### ① 선언 후 작업 — 이유를 쓰면 열리는 통행증\n- 뭘 하나: 에이전트가 작업 시작 전에 \"건드릴 파일 목록 + 각 파일을 왜 건드리는지\"를 먼저 쓰게 하고, 목록 밖 파일을 편집하려 할 때는 훅(편집 전 가로채는 스크립트)이 \"이 파일이 요청과 어떤 관계인지 한 줄\" 추가를 요구합니다. 쓰면 바로 허용, 못 쓰면 보류. 사람 승인은 없습니다.\n- 왜 내 상황에 맞나: 범위를 사전에 좁히지 않으니 필요한 수정을 못 해서 실패하는 일이 없고, \"관련 없는 파일 수정 금지\" 지시와 달리 매 편집마다 근거를 강제하므로 포맷 정리·눈에 띈 리팩터 같은 '습관성 수정'은 이유를 못 써 자연히 멈춥니다. 쌓인 이유 로그는 나중에 범위 규칙을 만드는 데이터가 됩니다.\n- 안 통하는 조건: 에이전트가 그럴듯한 이유를 아무 파일에나 붙이는 경우(이때는 ③과 결합).\n- 첫 실험: 개발자 1명이 1주간 에이전트 작업 10건에 적용 → 요청 무관 파일 변경이 건당 평균 1개 이하로 떨어지고, 과업 성공률이 지금보다 떨어지지 않으면 계속.\n\n### ② 범위를 \"폴더\"가 아니라 \"거리\"로 정하고, 막히면 저절로 넓어지게\n- 뭘 하나: 요청에 언급된 파일과 그 파일이 직접 import/호출하는 파일(1단계)만 처음에 편집 가능. 테스트가 실패하거나 편집이 거부되면 에이전트가 \"확장 요청 + 이유\"를 남기고 2단계(한 칸 더 먼 파일)까지 자동 확장. 3단계 이상만 사람이 승인.\n- 왜 내 상황에 맞나: 디렉토리 화이트리스트는 사람이 미리 정해야 해서 큰 코드베이스에서는 늘 빠지는 게 생기는데, 이 방식은 범위를 의존 그래프에서 자동 계산하고 \"막힘\"이 범위를 넓히므로 사전에 맞출 필요가 없습니다.\n- 안 통하는 조건: 의존 그래프를 뽑기 어려운 언어/동적 로딩이 많은 코드.\n- 첫 실험: 작업 5건을 1단계 범위로 시작, 확장 요청이 자동 승인된 뒤 성공한 비율을 기록 → 5건 중 4건 이상이 2단계 안에서 끝나면 계속.\n\n### ③ 무관 변경을 막지 말고 \"분리수거\"해 다른 출구로 보내기\n- 뭘 하나: 에이전트는 자유롭게 수정하게 두고, 끝난 뒤 두 번째 패스(또는 같은 에이전트)가 diff를 \"요청 관련 묶음\"과 \"그 외 묶음\" 두 커밋으로 반드시 나눕니다. 그 외 묶음은 본 PR에서 빼서 \"에이전트가 발견한 개선 후보\" 드래프트 PR 큐로 자동 이동.\n- 왜 내 상황에 맞나: 리뷰 후 수동 되돌리기와 달리 사람이 골라내지 않고, 버리지도 않습니다. 에이전트가 자꾸 건드리는 파일은 보통 실제로 손볼 가치가 있는 부채라서, 그 '고치고 싶은 욕구'를 메인 PR 밖으로 돌려 자산으로 바꿉니다.\n- 안 통하는 조건: 요청 변경이 공용 코드의 리팩터와 분리 불가능하게 얽힌 경우(이때 그 묶음은 '관련'으로 둠).\n- 첫 실험: 지난 에이전트 PR 10개를 대상으로 수동 분리 → 분리된 \"그 외 묶음\" 중 리뷰어가 실제로 별도 머지할 가치가 있다고 본 것이 30% 이상이면 자동화.\n\n### 와일드카드: 관련 모듈만 실물이고 나머지는 껍데기인 \"축소 사본\"에서 작업\n- 뭘 하나: 요청 관련 모듈만 실제 코드로 체크아웃하고, 나머지는 함수 시그니처만 남긴 스텁으로 둔 사본 저장소에서 에이전트가 작업합니다. 안 보이는 건 못 건드립니다. 에이전트가 스텁을 고치려 들면 그게 곧 \"이 모듈이 필요하다\"는 신호가 되어 실물로 교체.\n- 왜 내 상황에 맞나: 수정 금지 규칙은 에이전트가 어기지만, 존재하지 않는 코드는 어길 수 없습니다. 디렉토리 제한과의 차이는 \"막는다\"가 아니라 \"보이지 않게 하고, 건드리려는 시도를 확장 신호로 쓴다\"는 점.\n- 위험: 스텁 생성·빌드 유지 비용이 크고 컨텍스트 부족으로 품질이 떨어질 수 있음.\n- 첫 실험: 모듈 1개를 손으로 sparse checkout해 작업 3건 → 3건 중 2건 이상이 스텁 교체 2회 이내로 성공하면 스텁 자동 생성 검토.\n\n## 다음 행동\n1. 이번 주: ①을 훅 스크립트 하나로 붙이고 10건 돌리며 \"이유 로그\"를 모은다.\n2. 그 로그에서 자주 확장되는 파일 패턴을 보고 ②의 1단계 범위 정의에 반영한다.\n3. ①만으로 부족하면 ③을 리뷰 전 단계에 붙인다. 결과가 빈약하면 원리 40개 전부로 더 깊게 돌려볼 수 있습니다.\n\n## 근거(짧게)\n- 문제 재정의: \"에이전트의 변경이 요청의 의도 범위 안에 머물면서 필요한 변경은 모두 가능하게 한다\" → 한 단계 넓히면 \"무관한 변경이 메인 브랜치에 들어가지 않게 한다\"(생성 시점이 아니라 머지 시점에 풀어도 됨 → ③).\n- 제약(가정): 에이전트 자체는 교체 불가, 훅·프롬프트·CI 수준은 수정 가능, git과 테스트가 있는 큰 레포.\n- 기술적 모순(한쪽을 좋게 하면 다른 쪽이 나빠지는 관계): 범위 제한 강도↑ → 무관 수정↓, 과업 성공률↓.\n- 물리적 모순(한 요소에 반대 성질이 동시에 요구됨): 수정 범위는 좁아야(무관 변경 방지) 하고 동시에 넓어야(필요 변경 허용) 한다.\n- 분리(모순을 조건·시간·공간·수준으로 나눠 푸는 길)와 추천안의 연결: ① 조건 분리 — 이유를 쓰면 넓고 못 쓰면 좁다 / ② 공간+시간 분리 — 의존 거리가 가까우면 넓고, 막히는 순간 넓어진다 / ③ 시간 분리 — 작업 중엔 넓고 머지 시점엔 좁다 / 와일드카드: 공간 분리 — 보이는 곳만 넓다.\n\n## 부록(한 줄씩)\n- 무난한 답(금지 목록): 디렉토리 화이트리스트 / \"무관 파일 수정 금지\" 프롬프트 / 리뷰 후 수동 되돌리기 / 작업 잘게 쪼개기 / 계획 먼저 사람 승인 / CODEOWNERS·보호 브랜치 / 테스트 깨지면 롤백 / 더 좋은 모델\n- IFR(이상적 최종결과: 장치 없이 저절로 달성되는 상태): \"에이전트가 아무 제한 없이도 관련 파일만 건드리고, 무관한 변경은 저절로 사라진다\" / 공짜 자원: git 공동변경 이력, import 그래프, 에이전트의 파일 읽기 로그, 에이전트 자신의 diff, 과거 리뷰 코멘트, CI 유휴 시간\n- [포개기] 바깥 작업트리는 읽기전용, 안쪽 샌드박스에서 자유 수정 후 안→밖으로 옮길 때 걸러냄\n- [차원 변경] 범위를 디렉토리 트리가 아닌 \"의존 그래프 거리\" 축으로 정의 → ②\n- [등위성] 에이전트 환경의 포맷터·린트 설정을 레포와 동일하게 맞춰 포맷 노이즈 diff 자체를 0으로\n- [동질성] SKIP(CODEOWNERS와 규칙 통일 — 금지 목록과 같은 메커니즘)\n- [사전 반대조치] 자주 유혹받는 공용 util·설정 파일을 작업 전에 미리 정리해 두거나 \"손대지 말 것·이유\" 마커 삽입\n- [부분·과잉 작용] 범위를 정확히 맞추려 말고 과하게 고치게 둔 뒤 무관 hunk만 사후 보정 → ③의 전신\n- [전화위복] 무관 변경을 \"발견된 부채\" 큐로 전환 → ③\n- [복제] 관련 모듈만 실물인 축소 사본 레포 → 와일드카드\n- [색·투명도 변화] 파일마다 \"의존하는 모듈 수·요청 관련도\"를 색으로 표시해 에이전트와 리뷰어에게 드러냄\n- [열팽창] 테스트 실패 횟수가 오르면 범위가 한 단계 늘고 통과하면 수축 → ②의 자동 확장\n- 극단화 ①(당연한 전제 뒤집기): \"범위는 사람이 사전에 정한다\" → 에이전트가 선언하고 사후에 검증한다 → ①\n- 극단화 ②(거꾸로 하기): 두 번째 에이전트가 diff만 보고 \"이 변경의 요청은 무엇이었나\"를 역추론, 설명 안 되는 hunk가 곧 무관 변경 — ③의 분류기로 재활용 가능\n- 극단화 ③(먼 분야 유추): 수술 드레이프(노출 부위만 열기) → 와일드카드 / 금융 거래 한도(소액 자동·고액 승인) → ②의 단계별 승인\n- 수렴 점수(새로움/해볼 만함/효과): ① 3/5/4, ② 4/3/4, ③ 4/4/4, 와일드카드 5/2/3", "B": "핵심 모순은 \"범위를 넓히면 엉뚱한 파일을 건드리고, 좁히면 필요한 수정도 못 한다\"는 건데, 이건 **파일 목록(공간)으로 제한하려 해서** 생기는 문제입니다. 제한의 축을 바꾸면 양쪽을 동시에 잡을 수 있습니다. (가정: Claude Code/Cursor류 에이전트 + git 사용 환경)\n\n## 1. 시간으로 분리 — \"읽기 단계\"와 \"쓰기 단계\"를 나눔\n- 1단계: 에이전트가 수정 없이 코드를 탐색하고 **\"건드릴 파일 목록 + 각 파일을 왜 건드려야 하는지\"**를 먼저 제출.\n- 2단계: 그 목록이 곧 허용 범위. 범위는 사람이 미리 정하는 게 아니라 **에이전트가 조사해서 제안하고 승인받는** 것이라 좁지도 넓지도 않게 됩니다.\n- 작업 중 범위를 벗어나야 하면 막지 말고 **\"범위 확장 요청\"**을 하게 합니다 (사유 1줄). 하드 블록 → 협상으로 바꾸는 겁니다.\n\n## 2. 조건으로 분리 — 3단계 영역\n파일을 허용/금지 둘로 나누지 말고 세 구역으로:\n- **자유 구역**: 요청과 직접 연관된 모듈. 자유롭게 수정.\n- **회색 구역**: 의존성 그래프상 1~2홉 떨어진 파일. 수정은 가능하지만 **사유 기록 필수**, 리뷰 시 별도 표시.\n- **금지 구역**: 공용 라이브러리, 설정, 다른 팀 코드 등. 수정 대신 \"여기 바꿔야 할 것 같다\"는 보고만.\n\n회색 구역은 요청의 진입점에서 import/call 그래프를 따라 자동 산출할 수 있어서 작업마다 손으로 정할 필요가 없습니다.\n\n## 3. 입력 제한 → 출력 검증으로 전환 (가장 효과 큼)\n어느 파일을 만지는지 막는 대신, **결과물에 조건**을 걸어요:\n- 격리된 git worktree/브랜치에서 자유롭게 작업시키고, 끝난 뒤 diff를 **훙크 단위로 \"요청 관련 / 무관\"으로 분류**(저렴한 모델이나 규칙으로). 무관한 훙크는 자동으로 별도 커밋/PR로 분리하거나 되돌림.\n- \"범위 밖 파일을 건드렸으면 그 파일의 기존 테스트가 전부 통과해야 함\", \"public 시그니처 변경 금지\" 같은 **의미 기반 게이트**를 CI처럼 돌림.\n- 이렇게 하면 \"예방\"이 아니라 \"사후 분리\"가 되어, 필요한 수정은 통과하고 불필요한 수정만 걸러집니다.\n\n## 4. 근본 원인 제거 — 왜 엉뚱한 파일을 건드리는지\n큰 코드베이스에서 실제 원인은 대개 이 중 하나입니다:\n- **포매터/린터가 저장소 전체에 돌아감** → 변경된 줄에만 적용되게 설정.\n- **지나가다 발견한 기존 문제를 \"친절하게\" 고침** → 지침에 \"기존 이슈는 수정하지 말고 보고만 할 것\" 명시.\n- **import 자동 정렬, 사용 안 하는 코드 정리** 같은 부수 작업 → \"요청과 무관한 리팩터링 금지, 하고 싶으면 제안만\".\n- **탐색 중 길을 잃어 비슷한 이름의 파일을 잘못 수정** → 작업 시작 시 모듈 맵/CODEOWNERS를 컨텍스트로 제공.\n\nAGENTS.md(CLAUDE.md)에 위 규칙을 넣고, 추가로 **\"건드린 파일마다 요청과의 연결 사유를 한 줄로 남기기\"**를 요구하면 에이전트 스스로 불필요한 수정을 걸러내는 효과가 큽니다.\n\n## 5. 예산 방식\n\"파일 N개 또는 변경 L줄까지는 자유, 넘으면 멈추고 현재까지 상황 보고\" 같은 **범위 성장 예산**을 두면, 작은 작업은 막힘 없이 끝나고 큰 작업만 중간 체크포인트가 생깁니다.\n\n---\n\n**추천 조합**: ①계획 단계에서 범위 제안 → ③worktree에서 자유 작업 후 diff 자동 분류 → ④지침으로 \"지나가다 고치기\" 금지. 이 세 가지면 \"제한하되 막지 않는\" 구조가 됩니다. 파일 목록으로 막는 방식은 공용 설정/인프라 같은 금지 구역에만 최소로 쓰시는 게 좋습니다."}, {"id": "H1", "domain": "지역·서비스", "problem": "지방 소도시의 전통시장에 20~30대 방문객을 늘리고 싶어요. 예산은 거의 없고, 기존 상인분들은 변화를 싫어하세요. 아이디어가 필요해요.", "A": "**먼저 \"마감 떨이 실시간 알림 채널\"부터 해보세요. 상인은 지금 하던 그대로 하고, 청년 한 명이 폰으로 가격만 퍼뜨리는 거라 돈도, 상인 설득도 필요 없기 때문입니다.**\n\n### ① 마감 1시간 전 \"지금 ○○ 반값\" 알림 채널\n- 뭘 하나: 청년 운영자 1명(상인회 자녀·대학생·활동가)이 마감 1시간 전 시장을 한 바퀴 돌며 떨이 품목·가격을 사진으로 찍어 오픈채팅/인스타 스토리에 올립니다. 상인은 평소처럼 떨이만 합니다.\n- 왜 내 상황에 맞나: 새 할인을 만들지 않고 **이미 있는 떨이를 정보로만 바꾼 것**이라 예산 0, 상인 행동 변화 0. 흔한 \"할인 쿠폰·상품권\"과 달리 비용이 상인에게 가지 않고, 자취·신혼 20~30대의 \"저녁 뭐 먹지\"에 바로 꽂힙니다.\n- 안 통하는 조건: 떨이 시간이 20~30대 퇴근·귀가 시간과 안 겹치면(예: 오후 3시 마감) 효과가 반으로 줍니다.\n- 첫 실험: 운영자 1명이 4주간 주 3회 운영 → 채널 구독 100명, \"알림 보고 왔다\"는 손님 주 5명 이상이면 계속.\n\n### ② \"○○년째 그 자리\" 안 변한 것 인증 지도\n- 뭘 하나: 각 점포에 \"1987년부터 같은 자리, 같은 손, 같은 레시피\"처럼 **안 바뀐 사실** 한 줄을 적은 종이 명패를 붙이고, 그걸 모은 A4 한 장 지도를 입구와 SNS에 둡니다. 상인은 옛 이야기만 해주면 됩니다.\n- 왜 내 상황에 맞나: 변화를 요구하지 않고 **변화 거부 자체를 상품**으로 팝니다. 흔한 \"포토존·현대화\"는 새것을 만들지만, 이 안은 20~30대가 요즘 찾는 '진짜 오래된 것'을 이미 있는 그대로 드러냅니다. 상인에겐 자부심이 되니 반발이 거의 없습니다.\n- 안 통하는 조건: 상인이 자기 이야기를 하기 싫어하거나, 인증할 만큼 오래된 점포가 5곳 미만일 때.\n- 첫 실험: 2명이 2주간 상인 10명 인터뷰 → 동의 7곳 이상, 지도 게시 후 한 달 내 SNS 태그 20건 이상이면 확대.\n\n### ③ \"디지털 손주\" 교환 — 청년이 먼저 상인을 돕는다\n- 뭘 하나: 20~30대가 점포당 30분씩 네이버지도·카카오맵 등록, 영업시간·대표 메뉴 입력, 스마트폰 설정을 해 드리고, 상인은 덤·식재료로 갚습니다. 등록된 지도 정보가 다음 손님을 부릅니다.\n- 왜 내 상황에 맞나: 상인은 바꾸는 게 아니라 **받는 쪽**이라 거부 이유가 없습니다. 흔한 \"대학 봉사 연계\"는 청년만 주고 끝나지만, 이건 서로 주고받는 관계가 남고 결과물(지도 등록)이 영업 중 아무것도 안 바꿔도 검색 유입을 만듭니다.\n- 안 통하는 조건: 지도앱 등록이 이미 다 되어 있거나, 청년 참여자를 5명도 못 모을 때.\n- 첫 실험: 청년 3명이 토요일 2회, 점포 10곳 → 한 달 뒤 지도앱 \"길찾기·조회\" 수가 2배면 계속.\n\n### 와일드카드: 셔터 미술관 — 상인이 퇴근한 뒤에만 열리는 시장\n- 뭘 하나: 동의한 점포의 내린 셔터에 지역 미대생·청년 작가가 그림을 그리고, 밤 산책·사진 코스로 알립니다. 아침에 셔터를 올리면 그림은 사라지고 시장은 평소 그대로입니다.\n- 왜 내 상황에 맞나: 낮(상인의 시장)과 밤(청년의 시장)을 **시간으로 갈라** 둘이 부딪히지 않습니다. 흔한 \"벽화·포토존\"은 영업 중에도 남아 상인이 매일 봐야 하지만, 이건 상인 눈에 안 띕니다. **위험**: 셔터 소유·허가 문제, 물감 비용, \"내 셔터에 뭘 그려\" 반발.\n- 안 통하는 조건: 밤에 시장 골목이 어둡거나 안전하지 않을 때.\n- 첫 실험: 동의 점포 3곳, 지워지는 분필·스티커로 1회 → 2주간 밤 방문 사진 게시 15건 이상이면 페인트·지자체 벽화 예산 신청.\n\n### 다음 행동\n1. 이번 주: 상인회 자녀·지역 청년 중 \"폰 잘 쓰는 1명\"을 찾아 ①을 바로 시작.\n2. 동시에 ②의 인터뷰 대상 상인 10명을 상인회장과 함께 고르기(거부권은 기본).\n3. 한 달 뒤 ①②의 숫자를 보고 ③·와일드카드로 넘어갈지 결정. 결과가 빈약하면 더 깊게 발산해 드릴 수 있습니다.\n\n### 근거(짧게)\n- 가정: 질문자는 상인회·지자체·활동가 쪽이고, 예산은 인쇄물·소모품 수준, 20~30대는 지역 거주 청년과 인근 대학생·군인 포함.\n- 문제 재정의: \"20~30대가 시장을 자기 생활 동선에 넣게 한다\" — 더 넓게는 \"시장이 존속할 매출을 유지한다\".\n- 제약: 예산 ≈ 0 / 상인 행동 변화 불가 / 소도시라 청년 모수 자체가 작음.\n- 기술적 모순(한쪽을 좋게 하면 다른 쪽이 나빠지는 관계): 젊은 층 유인을 높이면 상인 반발이 커진다.\n- 물리적 모순(한 대상이 반대 성질을 동시에 요구받음): 시장은 \"변해야 하고(청년에게 새롭게) 동시에 변하지 않아야 한다(상인)\".\n- 분리로 풀기: ① 공간 분리(점포 안은 그대로, 정보 유통만 바깥에서) / ② 조건 분리(변하지 않음 자체를 청년 쪽 매력으로 뒤집어 모순 소멸) / ③ 수준 분리(점포는 그대로, 검색 노출층만 변화) / 와일드카드: 시간 분리(낮은 상인, 밤은 청년).\n- 점수(새로움·해볼 만함·효과): ① 2·5·4 / ② 4·4·3 / ③ 3·4·3 / 와일드카드 4·2·3.\n\n### 부록(한 줄씩)\n- 무난한 답(금지 목록): 청년몰 유치 / 인플루언서·해시태그 이벤트 / 야시장·푸드트럭 축제 / 할인 쿠폰·상품권 / 배달앱·온라인몰 입점 / 간판·시설 현대화 / 버스킹·플리마켓 / 포토존.\n- 발산 아이디어(IFR=이상적 최종결과: \"상인이 아무것도 안 바꾸고 돈도 안 쓰는데 20~30대가 스스로 찾아와 퍼뜨린다\"):\n- [포개기] 시장 골목을 역↔주거지 지름길로 지도앱에 등록해 통학·통근 동선 안에 끼우기\n- [다공질] 빈 셔터·빈 점포에 밤에만 보이는 그림 채우기 → 와일드카드\n- [등위성] SKIP(영업시간·결제를 청년 기준으로 맞추기 = 상인 변화 필요)\n- [동질성] SKIP(쇼츠 형식 통일 = SNS 홍보와 같은 메커니즘)\n- [사전 반대조치] 모든 프로그램을 '불참이 기본값, 동의 점포만' 구조로 설계해 반발을 미리 상쇄\n- [서두르기] \"10분 안에 5점포\" 시장 스피드런 미션으로 첫 방문의 어색함을 순식간에 통과\n- [무게 보상] 청년이 상인에게 먼저 디지털 도움을 주는 교환 관계 → ③\n- [복제] 대학 캠퍼스에 청년이 운영하는 '출장 미니 시장'을 열어 원본 방문 유도\n- [유체화] 시간에 따라 흘러내리는 떨이 가격을 실시간 알림으로 → ①\n- [열팽창] 군부대 외출·외박일, 공무원 급여일에 맞춰 입구 안내 1장만 바꾸기\n- 극단화(당연한 전제 뒤집기): \"상인이 변해야 한다\" → 안 변한 것이 상품 → ② / \"청년을 데려와야 한다\" → 상인의 자녀·손주가 이미 20~30대, 그들을 첫 전파자로\n- 극단화(거꾸로 하기): 청년을 쫓는 방법 \"가격 안 적기·사진 금지\"를 뒤집어 청년 봉사자가 가격표 붙이기, \"사진 환영\" 스티커\n- 극단화(먼 분야 유추, 의료): 동네 헬스장·PT가 식단 재료를 \"시장 처방전\"으로 써 주기\n- 다리 놓기: '청년 출입금지' 역심리 → 핵심은 \"비밀이 호기심을 만든다\" → 상인만 아는 숨은 메뉴 지도 / 시장 소리 라이브 → \"현장감이 끌어온다\" → 청년 1명 주 1회 폰 라이브 / 군 외출일 연동 → \"이미 모이는 날을 쓴다\" → 안내문 1장.", "B": "전통시장 활성화 사례들을 보면, 예산보다 **\"상인분들의 저항을 건드리지 않으면서 젊은 층이 올 이유를 만드는 것\"**이 핵심이에요. 가정은 이렇게 두겠습니다: 담당자는 시/군청 또는 상인회·청년단체 소속이고, 사용할 수 있는 돈은 수십만 원 이하, 시장은 평일 낮 중심으로 돌아가고 저녁·주말엔 빈 공간이 생긴다.\n\n## 원칙 먼저: 상인분들을 바꾸려 하지 마세요\n\n변화를 싫어하는 분들을 설득하는 것 자체가 가장 비싼 비용입니다. 그래서 전략은 두 가지로 압축돼요.\n\n1. **상인분들의 일상은 그대로 두고, \"주변\"을 바꾼다** — 빈 점포, 시장 골목, 영업 끝난 저녁 시간, 온라인 공간\n2. **상인분들을 '변화의 대상'이 아니라 '콘텐츠'로 만든다** — 40년 장사한 분의 얼굴과 이야기가 곧 20~30대가 보고 싶어하는 것\n\n## 아이디어 (예산 0~소액)\n\n**1. 빈 시간·빈 점포를 청년에게 무료 임대 (하루 단위)**\n저녁 6시 이후나 주말에 빈 점포·골목 한 켠을 청년 창업 희망자, 대학 동아리, 지역 디저트·수공예 팀에게 공짜로 내줍니다. 조건은 딱 하나, \"시장 식재료를 하나라도 써라\". 상인분들은 손해 볼 게 없고(오히려 재료가 팔림), 청년들은 임대료 없이 테스트할 자리가 생겨요. 이게 가장 저항이 적고 효과가 빠른 방식입니다.\n\n**2. \"사장님 도장 깨기\" 스탬프 카드**\nA4 한 장 인쇄 비용이 전부. 10곳 돌면 작은 보상(예: 상인회에서 떡 한 팩). 핵심은 \"도장\"이 아니라 **각 가게 사장님에게 말을 걸게 만드는 구조**예요. 20~30대는 '아는 사장님이 있는 시장'이 되면 다시 옵니다. 상인분께는 \"도장만 찍어주세요\"라고만 부탁하면 됩니다.\n\n**3. 상인분들의 이야기를 콘텐츠로 — 지역 대학·고등학교와 협업**\n영상·디자인·사진 전공 학생들에게 \"과제로 해달라\"고 제안하세요. 가게당 1분 영상, 손글씨 메뉴판 대신 **사장님 얼굴이 들어간 작은 간판 한 장**. 비용은 학생 교통비 정도. 사장님들은 사진 찍히는 걸 처음엔 쑥스러워하지만, 자기 가게가 영상에 나오면 가장 적극적인 홍보맨이 됩니다. 시장 인스타그램 계정은 담당자가 아니라 학생팀에게 맡기세요.\n\n**4. 월 1회 \"밤장\" (야간 플리마켓)**\n새로 뭘 짓는 게 아니라 영업 끝난 시장 통로를 그냥 씁니다. 청년 셀러 10팀, 로컬 밴드 1팀(무보수·노출 조건), 상인회에서 전기만 빌려주면 됩니다. 중요한 건 **매달 같은 날**(예: 마지막 토요일)로 고정해서 습관을 만드는 것. 첫 회는 50명만 와도 성공입니다.\n\n**5. 시장 안 '머무는 자리' 하나만 만들기**\n20~30대가 시장에 안 오는 가장 큰 이유 중 하나는 \"살 건 있는데 앉아서 먹을 데가 없다\"예요. 빈 점포 하나나 통로 구석에 중고 테이블·의자 몇 개, 콘센트, 와이파이. 커피는 근처 가게에서 사오게 하면 됩니다. 사진 찍을 만한 벽면 하나 정도만 학생들이 꾸며주면 충분해요.\n\n**6. \"시장 장보기 패키지\" — 온라인 주문, 1인 가구 타깃**\n요리 초보 1인 가구용 \"오늘 저녁 김치찌개 세트(돼지고기 200g + 두부 + 김치 + 대파)\" 같은 걸 묶어서 네이버 스마트스토어나 당근마켓 동네생활에 올립니다. 포장은 상인회 청년 1명이 맡고, 각 가게는 평소처럼 팔기만 하면 돼요. 소도시는 배달 반경이 좁아서 오히려 유리합니다.\n\n**7. 기존 제도 활용 — 예산은 밖에서 가져오기**\n- 소상공인시장진흥공단 **청년몰·특성화시장 사업**, 지자체 **청년상인 육성 공모**, 문화체육관광부 **문화관광형시장** 등은 매년 공모가 나옵니다. 위 1~5번 중 한두 개를 \"이미 하고 있는 실적\"으로 만들어 놓고 신청하면 선정 확률이 크게 올라갑니다.\n- **온누리상품권 환급 행사**는 비용 없이 결제 유인이 되고, 20~30대도 제로페이·카드형 온누리를 많이 씁니다.\n\n## 실행 순서 (추천)\n\n| 시기 | 할 일 | 비용 |\n|---|---|---|\n| 1개월차 | 상인회에서 \"우호적인 사장님\" 3~5명만 먼저 섭외, 스탬프 카드 시작 | 1~2만 원 |\n| 1~2개월차 | 지역 대학·고교 영상/디자인과 접촉, 사장님 인터뷰 콘텐츠 제작 시작 | 0~10만 원 |\n| 2~3개월차 | 빈 점포·저녁 시간 청년 무료 임대 공고 (당근마켓·대학 커뮤니티) | 0 |\n| 3개월차 | 첫 밤장 개최 (작게), 머무는 자리 하나 마련 | 10~30만 원 |\n| 4개월차~ | 실적 모아서 지자체·소진공 공모 신청 | 0 |\n\n## 상인분들 설득 요령 세 가지\n\n- **\"바꿔달라\"가 아니라 \"그대로 계셔달라\"**고 말하세요. \"사장님 가게는 그대로고, 옆에 젊은 애들이 좀 돌아다닐 거예요\" 정도.\n- 전체 동의를 받으려 하지 말고 **가장 호의적인 3명**과 먼저 시작하세요. 옆 가게 매출이 오르는 걸 보면 나머지는 알아서 옵니다.\n- 상인분들이 가장 싫어하는 건 변화 자체보다 **\"또 공무원들이 와서 사진 찍고 가는 것\"**입니다. 첫 3개월은 성과 보고보다 \"매주 같은 얼굴이 시장에 나타나는 것\"에 집중하세요.\n\n필요하시면 상인회 설명용 1장짜리 제안서나 공모사업 신청서 초안도 만들어 드릴 수 있어요."}]</script>

<script>
(function(){

];

var ft; function flash(t){ var el=document.getElementById('saved'); el.textContent=t; clearTimeout(ft); ft=setTimeout(function(){el.textContent='';},1800); }
function md(s){ try{ return window.marked ? window.marked.parse(s,{gfm:true,breaks:false}) : '<pre>'+esc(s)+'</pre>'; }catch(e){ return '<pre>'+esc(s)+'</pre>'; } }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function cur(){ var p=PAIRS[state.idx]; if(!state.ans[p.id]) state.ans[p.id]={winner:null,r:{A:{},B:{}},c:''}; return state.ans[p.id]; }
function isDone(id){ var a=state.ans[id]; if(!a||!a.winner) return false; for(var i=0;i<CRIT.length;i++){ if(!a.r.A[CRIT[i].id]||!a.r.B[CRIT[i].id]) return false; } return true; }

function render(){

  var p=PAIRS[state.idx], a=cur(), v=document.getElementById('view');
  v.innerHTML='';
  var prob=el('section','problem'); prob.innerHTML='<small>문제 '+(state.idx+1)+' / '+PAIRS.length+' · '+esc(p.domain)+'</small><p>'+esc(p.problem)+'</p>';
  v.appendChild(prob);

  var tabs=el('div','tabs-m'); ['A','B'].forEach(function(k){
    var b=el('button'); b.type='button'; b.textContent='답안 '+k; b.setAttribute('aria-pressed',String(mobileTab===k));
    b.onclick=function(){ mobileTab=k; render(); }; tabs.appendChild(b); });
  v.appendChild(tabs);

  var cols=el('div','cols');
  ['A','B'].forEach(function(k){
    var c=el('article','col '+k+(mobileTab!==k?' hidden-m':''));
    c.innerHTML='<h2>답안 '+k+'<span>'+(p[k].length.toLocaleString())+'자</span></h2><div class="md">'+md(p[k])+'</div>';
    cols.appendChild(c);
  });
  v.appendChild(cols);

  var ev=el('section','eval');
  ev.innerHTML='<h3>1. 어느 쪽이 더 도움이 되나요?</h3>';
  var w=el('div','winner');
  [['A','답안 A'],['B','답안 B'],['tie','비슷함']].forEach(function(o){
    var b=el('button','pick'); b.type='button'; b.dataset.v=o[0]; b.textContent=o[1]; b.setAttribute('aria-pressed',String(a.winner===o[0]));
    b.onclick=function(){ a.winner=o[0]; save(); render(); }; w.appendChild(b); });
  ev.appendChild(w);
  var hint=el('p','hint'); hint.textContent='읽은 느낌 그대로 고르세요. 길이가 아니라 내 문제에 실제로 쓸모 있었는지가 기준입니다.'; ev.appendChild(hint);

  var h2=el('h3'); h2.textContent='2. 항목별 별점 (1 = 아쉬움, 5 = 매우 좋음)'; ev.appendChild(h2);
  var t=el('table','rtable'); var thead='<tr><th>항목</th><th>답안 A</th><th>답안 B</th></tr>'; t.innerHTML='<thead>'+thead+'</thead>';
  var tb=el('tbody');
  CRIT.forEach(function(cr){
    var tr=el('tr'); var td0=el('td','crit'); td0.innerHTML=esc(cr.t)+'<small>'+esc(cr.s)+'</small>'; tr.appendChild(td0);
    ['A','B'].forEach(function(k){
      var td=el('td',k+'-col'); var st=el('div','stars');
      for(var n=1;n<=5;n++){ (function(n){
        var b=el('button','st'); b.type='button'; b.textContent=n; b.setAttribute('aria-label',cr.t+' 답안 '+k+' '+n+'점');
        b.setAttribute('aria-pressed',String(a.r[k][cr.id]===n));
        b.onclick=function(){ a.r[k][cr.id]=n; save(); render(); }; st.appendChild(b); })(n); }
      td.appendChild(st); tr.appendChild(td); });
    tb.appendChild(tr); });
  t.appendChild(tb); ev.appendChild(t);

  var h3=el('h3'); h3.textContent='3. 한마디 (선택) — 해보고 싶은 아이디어, 이상했던 점 등'; ev.appendChild(h3);
  var ta=el('textarea'); ta.value=a.c||''; ta.setAttribute('aria-label','코멘트');
  ta.oninput=function(){ a.c=ta.value; save(); }; ev.appendChild(ta);

  var nav=el('div','nav');
  var prev=el('button','btn'); prev.type='button'; prev.textContent='← 이전'; prev.disabled=state.idx===0;
  prev.onclick=function(){ state.idx--; save(); render(); window.scrollTo({top:0}); };
  var next=el('button','btn primary'); next.type='button';
  var last=state.idx===PAIRS.length-1;
  next.textContent=last?'결과 보기':'다음 →';
  next.disabled=!isDone(p.id);
  next.title=isDone(p.id)?'':'승자 선택과 8개 별점을 모두 채우면 넘어갈 수 있어요';
  next.onclick=function(){ if(last){ showResult(); } else { state.idx++; save(); render(); window.scrollTo({top:0}); } };
  nav.appendChild(prev); nav.appendChild(next); ev.appendChild(nav);
  v.appendChild(ev);
  if(doneCount()===PAIRS.length) showResult(true); else document.getElementById('result').innerHTML='';
}

function el(tag,cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }

function key(){ try{ return JSON.parse(decodeURIComponent(escape(atob(KEYB64)))); }catch(e){ return null; } }
function cond(pid,slot){ var k=key(); return k&&k[pid]?k[pid][slot]:null; }

function rows(){
  return PAIRS.map(function(p){
    var a=state.ans[p.id]||{r:{A:{},B:{}}};
    var r={id:p.id, domain:p.domain, winner:a.winner, A_is:cond(p.id,'A'), B_is:cond(p.id,'B'), comment:a.c||''};
    ['A','B'].forEach(function(k){ CRIT.forEach(function(c){ r[k+'_'+c.id]=a.r&&a.r[k]?a.r[k][c.id]||'':''; }); });
    r.winner_is = a.winner==='tie'?'tie':(a.winner? cond(p.id,a.winner):'');
    return r; });
}
function download(name,text,type){ var b=new Blob([text],{type:type}); var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},500); }
function toCSV(rs){ if(!rs.length) return ''; var cols=Object.keys(rs[0]); var q=function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return '﻿'+[cols.join(',')].concat(rs.map(function(r){ return cols.map(function(c){return q(r[c]);}).join(','); })).join('\n'); }

function avg(a){ return a.length? (a.reduce(function(x,y){return x+y;},0)/a.length):0; }
function showResult(auto){
  var box=document.getElementById('result'); var rs=rows();
  var wins={skill:0,base:0,tie:0};
  rs.forEach(function(r){ if(r.winner_is==='tie') wins.tie++; else if(r.winner_is==='skill') wins.skill++; else if(r.winner_is==='base') wins.base++; });
  var sc={skill:{},base:{}}; CRIT.forEach(function(c){ sc.skill[c.id]=[]; sc.base[c.id]=[]; });
  rs.forEach(function(r){ ['A','B'].forEach(function(k){ var who=r[k+'_is']; CRIT.forEach(function(c){ var v=r[k+'_'+c.id]; if(v) sc[who][c.id].push(v); }); }); });
  var html='<div class="result"><h2>평가 완료 🎉</h2><div class="saved" style="margin-bottom:8px">이제 정답이 공개됩니다. 아래에서 결과 파일을 저장하세요.</div>';
  html+='<div class="res-grid"><div class="kpi skill"><b>'+wins.skill+'</b><span>스킬 답안이 이긴 문제</span></div><div class="kpi"><b>'+wins.base+'</b><span>스킬 없는 답안이 이긴 문제</span></div><div class="kpi"><b>'+wins.tie+'</b><span>비슷함</span></div></div>';
  html+='<table class="rev"><thead><tr><th>항목</th><th>스킬 평균</th><th>스킬 없음 평균</th><th>차이</th></tr></thead><tbody>';
  CRIT.forEach(function(c){ var s=avg(sc.skill[c.id]), b=avg(sc.base[c.id]); var d=s-b;
    html+='<tr><td>'+esc(c.t)+'</td><td>'+s.toFixed(2)+'</td><td>'+b.toFixed(2)+'</td><td>'+(d>0?'+':'')+d.toFixed(2)+'</td></tr>'; });
  html+='</tbody></table>';
  html+='<table class="rev"><thead><tr><th>문제</th><th>A는</th><th>B는</th><th>내 선택</th></tr></thead><tbody>';
  rs.forEach(function(r,i){ var f=function(x){return x==='skill'?'<span class="badge skill">스킬</span>':'<span class="badge base">스킬 없음</span>';};
    html+='<tr><td>문제 '+(i+1)+' · '+esc(r.domain)+'</td><td>'+f(r.A_is)+'</td><td>'+f(r.B_is)+'</td><td>'+(r.winner==='tie'?'비슷함':f(r.winner_is))+'</td></tr>'; });
  html+='</tbody></table>';
  html+='<div class="nav" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn primary" id="xj" type="button">JSON 저장</button><button class="btn" id="xc" type="button">CSV 저장</button><button class="btn" id="xr" type="button">처음부터 다시</button></div>';
  html+='<p class="hint" style="margin-top:10px">별점은 1~5점이며 4문제 이상이면 경향을 볼 수 있지만, 사람 수가 적으면 우연일 수 있어요. 가능하면 여러 사람이 각자 평가해 파일을 모아 비교하세요.</p></div>';
  box.innerHTML=html;
  document.getElementById('xj').onclick=function(){ download('human-eval-result-2.json',JSON.stringify(rs,null,2),'application/json'); };
  document.getElementById('xc').onclick=function(){ download('human-eval-result-2.csv',toCSV(rs),'text/csv;charset=utf-8'); };
  document.getElementById('xr').onclick=function(){ if(confirm('입력한 평가를 모두 지우고 처음부터 다시 할까요?')){ state={idx:0,ans:{}}; save(); render(); window.scrollTo({top:0}); } };
  if(!auto) box.scrollIntoView({behavior:'smooth'});
}

(function theme(){
  var b=document.getElementById('theme'); var root=document.documentElement;
  try{ var t=localStorage.getItem('triz-human-theme'); if(t) root.setAttribute('data-theme',t); }catch(e){}
  b.onclick=function(){ var dark=getComputedStyle(root).getPropertyValue('--bg').trim()==='#10131a'; var n=dark?'light':'dark'; root.setAttribute('data-theme',n); try{localStorage.setItem('triz-human-theme',n);}catch(e){} };
})();

load(); if(state.idx>=PAIRS.length||state.idx<0) state.idx=0; render();
})();
</script>
</body>
</html>
