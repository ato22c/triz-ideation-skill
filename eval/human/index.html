<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A/B 블라인드 평가</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1c2230; --muted:#667085; --line:#dfe3ea;
  --a:#2563eb; --a-soft:#e8f0ff; --b:#d9480f; --b-soft:#fff0e8; --ok:#16794a; --ok-soft:#e6f6ee;
  --accent:#4f46e5; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131a; --card:#171b24; --ink:#e8ebf2; --muted:#98a2b3; --line:#2a3040;
    --a:#7aa2ff; --a-soft:#1b2744; --b:#ff9a6b; --b-soft:#3a2418; --ok:#5fd29a; --ok-soft:#123424;
    --accent:#8b86ff; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#10131a; --card:#171b24; --ink:#e8ebf2; --muted:#98a2b3; --line:#2a3040;
  --a:#7aa2ff; --a-soft:#1b2744; --b:#ff9a6b; --b-soft:#3a2418; --ok:#5fd29a; --ok-soft:#123424;
  --accent:#8b86ff; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.progress{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip.done::after{content:" ✓";color:var(--ok);font-weight:700}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;font-family:inherit}
.problem{margin:20px 0 14px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.problem small{color:var(--muted);display:block;margin-bottom:4px;font-size:12px;letter-spacing:.02em}
.problem p{margin:0;font-size:17px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.col>h2{margin:0;padding:10px 16px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.col.A>h2{background:var(--a-soft);color:var(--a)} .col.B>h2{background:var(--b-soft);color:var(--b)}
.col h2 span{font-size:12px;font-weight:400;opacity:.8}
.md{padding:6px 18px 18px;overflow-wrap:anywhere;font-size:15px}
.md h1,.md h2,.md h3,.md h4{line-height:1.35;margin:1.2em 0 .4em}
.md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15.5px}.md h4{font-size:15px}
.md ul,.md ol{padding-left:1.3em}.md li{margin:.2em 0}
.md code{background:color-mix(in srgb,var(--line) 60%,transparent);padding:.1em .35em;border-radius:5px;font-size:.92em}
.md pre{background:color-mix(in srgb,var(--line) 50%,transparent);padding:10px 12px;border-radius:8px;overflow:auto;white-space:pre-wrap}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;width:100%;font-size:13.5px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md blockquote{margin:.8em 0;padding:.1em 1em;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.eval{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.eval h3{margin:0 0 10px;font-size:16px}
.winner{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pick{flex:1;min-width:120px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.pick[data-v="A"][aria-pressed="true"]{border-color:var(--a);background:var(--a-soft);color:var(--a)}
.pick[data-v="B"][aria-pressed="true"]{border-color:var(--b);background:var(--b-soft);color:var(--b)}
.pick[data-v="tie"][aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.rtable{width:100%;border-collapse:collapse;margin:8px 0 14px}
.rtable th{font-weight:600;text-align:left;font-size:13px;color:var(--muted);padding:4px 6px}
.rtable td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.crit{font-size:14px}.crit small{display:block;color:var(--muted);font-size:12px}
.stars{display:flex;gap:4px}
.st{width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.st[aria-pressed="true"]{color:#fff;border-color:transparent}
.A-col .st[aria-pressed="true"]{background:var(--a)} .B-col .st[aria-pressed="true"]{background:var(--b)}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.result{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.result h2{margin:0 0 6px;font-size:18px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;line-height:1.2}.kpi span{color:var(--muted);font-size:13px}
.kpi.skill b{color:var(--ok)}
.rev{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.rev th,.rev td{border-top:1px solid var(--line);padding:7px 6px;text-align:left}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.badge.skill{background:var(--ok-soft);color:var(--ok)}.badge.base{background:var(--line);color:var(--muted)}
.saved{font-size:12px;color:var(--muted)}
.intro{margin:20px 0 0;padding:14px 18px;background:var(--card);border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.intro b{color:var(--ink)}
@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  .tabs-m{display:flex}
  .col.hidden-m{display:none}
}
.tabs-m{display:none;gap:8px;margin-bottom:10px;position:sticky;top:56px;z-index:10}
.tabs-m button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-family:inherit;font-size:15px}
.tabs-m button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.st:focus-visible,.pick:focus-visible,.btn:focus-visible,.chip:focus-visible,textarea:focus-visible,.tabs-m button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>A/B 블라인드 평가</h1>
  <div class="progress"><span id="pcount">0/0</span><div class="bar"><i id="pbar"></i></div><span class="saved" id="saved"></span></div>
  <div class="chips" id="chips"></div>
  <button class="theme" id="theme" type="button" aria-label="화면 밝기 전환">◐</button>
</div></header>

<main class="wrap">
  <div class="intro"><b>어떻게 하나요?</b> 문제마다 <b>답안 A</b>와 <b>답안 B</b>를 읽고, 더 도움이 되는 쪽을 고른 뒤 항목별 별점(1~5)을 매겨주세요.
  어느 쪽이 스킬을 쓴 답인지는 <b>모두 끝낸 뒤</b>에 공개됩니다. 답안은 기능·길이가 다를 수 있으니, 길이가 아니라 <b>내게 얼마나 쓸모 있었는지</b>로 판단해 주세요.
  입력은 이 브라우저에 자동 저장됩니다.</div>
  <div id="view"></div>
  <div id="result"></div>
</main>

<script id="data" type="application/json">[{"id": "H1", "domain": "지역·서비스", "problem": "지방 소도시의 전통시장에 20~30대 방문객을 늘리고 싶어요. 예산은 거의 없고, 기존 상인분들은 변화를 싫어하세요. 아이디어가 필요해요.", "A": "# 전통시장에 20~30대를 부르는 아이디어\n\n**가정:** 인구 수만 명의 소도시, 점포 수십~100여 곳, 상인 대부분 60대 이상. 시장 근처에 원룸촌이나 대학이 있고, 20~30대는 대체로 자취하거나 직장인이다. 상인 중 한두 분은 호의적일 것이다. 지자체 지원금은 쓰지 않는다. 별도 요청이 없어 빠르게 모드로 진행했다.\n\n## 1. 추천 3안 + 와일드카드\n\n### 안 1. 일손 교환: 30분 도와주면 재료를 가져간다\n- **한 줄 요약:** 토요일 오전, 손님이 몰리기 직전 30분에 청년이 마늘 까기, 채소 다듬기, 포장 같은 잔일을 돕는다. 돈은 오가지 않고, 대가로 그 가게 재료를 한 봉지 받아 간다.\n- **왜 뻔하지 않은가:** 흔한 답인 '청년 상인 입점'이나 '체험 행사'는 상인이 새 일을 맡거나 판을 벌여야 한다. 이 안은 상인에게 모자란 일손을 공짜로 보태 주고, 청년에게는 재료와 상인의 손기술을 준다. 상인이 하는 일은 늘지 않는다.\n- **한계:** 위생과 칼 같은 안전 문제가 있고, 상인이 \"손이 더 간다\"고 느끼면 바로 접힌다. 일손이 남는 가게에서는 통하지 않는다.\n- **첫 실험:** 호의적인 상인 2곳과 지인 청년 8명(주 2명씩)으로 4주간 토요일 10:30~11:00에 진행한다. 성공 기준은 청년 8명 중 4명 이상이 2주 안에 자기 돈으로 다시 사러 오고, 상인 2곳 모두 \"계속하겠다\"고 하는 것이다. 청년 재방문이 2명 이하이거나 상인 1곳이라도 중단하면 실패다. 비교 대상은 같은 시간대에 20~30대 손님 수를 손으로 센 같은 업종의 다른 2곳이다. 흐리는 요인은 지인이라서 재방문이 부풀려지는 것이다.\n\n### 안 2. 한정 20개: 오전 9시 선착순 줄 세우기\n- **한 줄 요약:** 상인이 이미 파는 물건(참기름, 수제 두부, 어묵 등) 중 20개만 따로 빼 \"토요일 오전 9시부터 선착순 20개\"라고 손글씨로 붙인다. 남은 개수는 숫자 하나로 가게 앞에 적는다.\n- **왜 뻔하지 않은가:** 흔한 답인 '할인 쿠폰'이나 '축제'는 값을 깎거나 판을 키워서 부른다. 이 안은 오히려 공급을 제한해 \"일찍 가야 산다\"는 이유를 만든다. 상인이 바꾸는 건 종이 한 장과 물건 20개를 따로 빼 두는 것뿐이다.\n- **한계:** 20개를 기존 단골 어르신이 먼저 다 사 가면 청년에게 닿지 않는다. 물건 자체가 매력 없으면 줄이 생기지 않는다.\n- **첫 실험:** 1곳에서 4주간 토요일마다 진행한다. 성공 기준은 20개 중 8개 이상이 20~30대에게 팔리고, 오전 9~10시 20~30대 구매자가 주당 6명 이상(시작 전 2주 평균보다 3명 이상 증가)인 것이다. 20~30대에게 팔린 게 4개 미만이면 실패다. 비교 대상은 시작 전 2주의 같은 시간 기록이다. 흐리는 요인은 장날이나 행사와 겹치는 주다.\n\n### 안 3. '안 바꾼 것'을 그대로 내세우기\n- **한 줄 요약:** 현금, 저울, 흥정, 좁은 통로처럼 시장의 불편을 고치지 않는다. 입구와 자취촌 게시판에 \"여기는 아직 현금·저울·흥정으로 삽니다. 덤은 기분 따라\"라는 종이 한 장만 붙인다.\n- **왜 뻔하지 않은가:** 흔한 답인 '포토존이나 리모델링'은 시장을 젊게 꾸며서 부른다. 이 안은 바꾸지 않는 것 자체를 \"요즘 보기 드문 경험\"으로 다시 포장한다. 상인은 하던 대로만 하면 된다.\n- **한계:** 종이 한 장은 시장 근처에 오지 않는 사람에게는 닿지 않는다. 불편함이 진짜 불쾌함이면 역효과다.\n- **첫 실험:** 4주간 홀수 주는 안내문을 붙이고 짝수 주는 뗀다. 토·일 10~12시 입구를 지나는 20~30대를 손으로 센다. 성공 기준은 붙인 주가 뗀 주보다 20% 이상 많은 것이고, 10% 미만이면 실패다. 비교 대상은 안내문을 뗀 주 자체다. 흐리는 요인은 날씨다. 최소 규모는 입구 1곳, 자취촌 게시판 3곳이다.\n\n### 와일드카드. 가게 입양제\n- **한 줄 요약:** 청년이 가게 하나를 골라 3개월간 '양자'가 된다. 가게 앞에 \"OO네 가게\"라고 이름 쓴 종이를 붙이고, 상인은 그 청년을 이름으로 부른다.\n- **왜 뻔하지 않은가:** 흔한 답인 '단골 도장 카드'는 혜택을 주고 오게 한다. 이 안은 혜택 없이 소속감과 호칭으로 오게 한다. 외로운 지방 청년이 \"내 가게가 생긴다\"는 점을 이용한다.\n- **한계:** 상인이 관계를 챙겨야 해서, 변화를 싫어하는 문제를 온전히 풀지 못한다. 그래서 추천이 아닌 와일드카드다.\n- **첫 실험:** 상인 3곳과 청년 6명을 원룸촌 게시판으로 모집해 추첨으로 입양 6명, 대조 6명으로 나눈다. 4주간 센다. 성공 기준은 입양 청년 6명 중 4명 이상이 주 1회 이상 방문하고, 상인 3곳 중 2곳이 계속 의사를 밝히는 것이다. 대조군 방문이 입양군의 절반 이상이면 효과가 없다고 본다. 흐리는 요인은 자원자가 원래 시장을 좋아하는 사람이라는 점이다.\n\n## 2. 다음 행동\n- 안 3부터 시작한다. 종이 한 장, 돈 0원이라 이번 주말에 바로 할 수 있다.\n- 호의적인 상인 2곳을 찾아 안 1과 안 2를 같이 제안한다. 처음부터 \"언제든 그만두셔도 됩니다, 원상복구 책임은 저희가 집니다\"를 말로 약속하면 반대가 줄어든다.\n- 결과가 빈약하면 40개 원리를 전부 도는 깊게 모드로 올릴 수 있다.\n\n## 3. 근거: 문제 재정의와 모순\n- **기능 문장:** 20~30대가 스스로 시장에 와서 사고, 다시 오게 한다. \"왜?\"를 두 번 올려 보면 '시장이 다음 세대의 일상에 들어오는 것'이 더 넓은 목표지만, 문장은 그대로 유지했다.\n- **기술적 모순(한쪽을 좋게 하면 다른 쪽이 나빠지는 관계):** 젊은 방문객이 늘수록 상인의 부담과 저항이 커진다.\n- **물리적 모순(한 요소가 서로 반대를 요구받는 관계):** 시장은 변하면 안 되고(상인의 뜻, 정체성), 동시에 변해야 한다(젊은 사람 유입). 분리 4종 중 수준(시장 전체는 그대로, 일부만 변화), 시간(토요일 오전만), 조건(동의한 가게만)으로 푼다.\n- **IFR(이상적 최종결과):** 젊은이가 상인의 추가 수고와 돈 없이 스스로 와서 사고 다시 온다. 상인은 하던 그대로다.\n- **공짜 자원:** 피크 직전의 일손 부족, 셔터 내린 빈 점포, 상인의 손기술, 남는 자투리 재료, 자취촌 청년, 종이와 칠판.\n- **추천안과 모순의 연결:**\n  - 안 1: 수준 분리와 시간 분리. 상인 일은 늘리지 않고 한 가게, 한 시간대만 바뀐다.\n  - 안 2: 수준 분리. 물건 20개와 종이 한 장만 바뀐다.\n  - 안 3: IFR의 \"상인은 하던 그대로\" 부분. 바꾸지 않는 것이 매력이 된다.\n  - 와일드카드: 수준 분리로 3곳만 바꾸지만 상인 부담이 남는다. 그래서 와일드카드로 밝힌다.\n- **메커니즘 검사** (가장 비슷한 무난한 답 / 작동 원리가 다른 점):\n  - 안 1 / 청년 체험 행사 / 행사 진행자 없이 상인의 일손 부족과 청년의 배우고 싶은 욕구를 노동과 재료로 맞바꿈\n  - 안 2 / 할인 쿠폰 / 값이 아닌 수량 제한이 방문 이유가 됨\n  - 안 3 / 포토존·리모델링 / 무언가를 더하지 않고 유지 자체를 희소성으로 포장\n  - 와일드카드 / 단골 도장 카드 / 보상이 아닌 호칭과 소속이 방문 이유\n\n## 4. 평가표\n\n| 후보 | 참신도 | 이상성 | 실현성 | 비고 |\n|---|---|---|---|---|\n| 안 1 일손 교환 | 4 | 4 | 3 | 무난한 답과 달리 돈이 아닌 노동으로 맞바꾼다 |\n| 안 2 한정 20개 | 3 | 4 | 5 | 쿠폰의 반대 방향이지만 '희소성'은 익숙하다 |\n| 안 3 안 바꾼 것 | 3 | 3 | 5 | 종이 한 장, 효과는 불확실 |\n| 와일드카드 입양 | 4 | 3 | 3 | 무난한 답과 달리 혜택 없이 호칭으로 부른다 |\n| 소량 구매 카드(보조) | 2 | 3 | 5 | 소량 포장 안내의 변형 |\n| 자투리 봉지(보조) | 2 | 3 | 4 | 할인 판매의 변형 |\n| 숨은 품목(보조) | 2 | 3 | 4 | 스탬프 카드의 변형 |\n\n**보조 아이디어(실용적이지만 흔한 답의 변형):** 1인분 소량 구매 안내 카드, 남는 자투리 채소 한 봉지 판매, 세 번째 방문 때만 파는 숨은 품목.\n\n## 부록\n\n### A. 금지 목록(뻔한 답)\n1. SNS 홍보와 감성 포토존\n2. 야시장과 푸드 축제\n3. 청년몰과 청년 상인 입점\n4. 인플루언서와 유튜버 협업\n5. 상품권과 할인 쿠폰 이벤트\n6. 공연과 플리마켓 등 행사\n7. 간판과 시설 리모델링\n8. 배달앱과 온라인 판매\n\n### B. 발산 로그\n- #1 [2 추출] 낯선 이유 중 \"얼마나 사야 할지 모름\"만 떼어 소량 구매 카드를 만든다 — 진입 장벽 하나만 제거\n- #2 [2 추출] 상인의 손기술 하나를 20분 시연한다 — 기술 전수\n- #3 [31 다공질] 오후의 한산한 틈에 젊은 손을 끼워 넣는다 — 유휴시간에 노동 투입\n- #4 [31 다공질] 셔터 내린 빈 점포 앞을 저녁 서서 먹는 자리로 쓴다 — 빈 공간 재사용(야시장의 변형)\n- #5 [6 범용성] 저울, 도마, 박스가 체험 도구를 겸한다 — 새 장비 없이 기존 물건 재사용\n- #6 [33 동질성] SKIP(시장 특유의 잡다함이 사라져 매력이 줄어든다)\n- #7 [9 사전반대조치] \"언제든 중단, 원상복구 책임은 우리가\" 약속을 먼저 준다 — 저항을 사전에 무력화\n- #8 [20 유익한 작용의 연속] 피크 직전 30분 일손을 재료와 교환한다 — 안 1의 씨앗\n- #9 [25 셀프서비스] 손님이 가게 칠판에 \"오늘의 한 줄\"을 쓰고 다음 손님이 읽는다 — 손님이 안내자\n- #10 [22 전화위복] 시장의 불편을 고치지 않고 상품으로 삼는다 — 안 3의 씨앗\n- #11 [32 색·투명도] 남은 개수를 숫자 하나로 가게 앞에 표시한다 — 희소성의 시각화\n- #12 [28 다른 채널] 방앗간 냄새를 원룸촌 쪽으로 보낸다 — 후각으로 부르기\n- #13 [거꾸로 하기] 젊은이를 못 오게 하려면 입장 제한과 한정 수량 — 안 2의 씨앗\n- #14 [거꾸로 하기] 상인이 손님이고 청년이 주인인 하루 — 역할 뒤집기(황당 1)\n- #15 [전제 뒤집기] 돈 먼저 → 첫 구매 후불(외상 한 봉지) — 신용 기반\n- #16 [전제 뒤집기] 상인이 손님을 맞는다 → 청년이 가게를 고른다 — 와일드카드의 씨앗\n- #17 [먼 분야 유추: 게임] 세 번째 방문에서 열리는 숨은 품목 — 호감도 해금\n- #18 [STC 시간 ∞] 24시간 무인 정직 판매대 — 신뢰 판매\n- #19 [STC 크기 0] 시장 한 코너의 축소판을 빨래방에 진열한다 — 복제\n\n### C. 다리 놓기(가장 황당한 3개 → 핵심 한 줄 → 현실 버전)\n- #14 상인이 손님, 청년이 주인인 하루 → 핵심: 상인의 쉬는 시간과 청년의 해보고 싶은 마음을 맞바꿈 → 안 1\n- #13 입장 제한과 한정 수량 → 핵심: 못 사게 막을수록 원함 → 안 2\n- 시장 전체를 낡은 그대로 두기 → 핵심: 바꾸지 않는 것이 가치 → 안 3", "B": "# 지방 소도시 전통시장 20~30대 유입 아이디어\n\n## 가정\n- 시장에 상인회(또는 대표 상인 몇 분)가 있고, 협조 가능한 소수 \"열린 상인\"이 있다.\n- 예산은 0원에 가깝고, 인력은 청년 자원봉사자·지역 대학생·청년 창업자 정도를 활용할 수 있다.\n- 지자체 소상공인 지원, 문화관광 사업 공모는 별도 자금 없이 신청 가능하다.\n\n## 핵심 전략\n20~30대는 \"물건을 사러\" 오기보다 \"경험하고 인증하러\" 온다. 그러므로 상인을 바꾸지 말고, 상인이 이미 하는 것을 \"보이는 방식\"만 바꾼다. 기존 상인에게는 \"아무것도 안 하셔도 된다\"를 원칙으로 한다.\n\n## 아이디어\n\n### 1. 변화 없이 시작하는 것 (상인 부담 0)\n1. **청년이 대신 홍보하는 \"시장 큐레이터\"**: 지역 대학생·청년이 인스타그램/릴스/네이버 지도에 가게 소개를 대신 올린다. 상인은 평소처럼 장사만 한다. 사진 촬영 동의만 받는다.\n2. **\"오늘의 시장 픽\" 지도**: 종이 한 장 또는 무료 지도 앱에 \"혼자 먹기 좋은 곳, 데이트 코스, 1만원 투어\"를 정리한다. 기존 가게를 재배열할 뿐이다.\n3. **1만원 시장 미션 투어**: 가게 5곳에서 소량(반 개, 한 입 크기)씩 먹고 스탬프를 모으는 코스. 상인은 기존 상품을 작은 단위로 팔기만 하면 된다.\n4. **소량·1인분 포장 요청 카드**: \"반 마리, 2~3개만 주세요\"라고 말할 수 있는 카드를 계산대에 둔다. 젊은 층이 부담 없이 사게 한다.\n\n### 2. 시간·공간 빌리기 (돈 안 드는 자원)\n5. **빈 점포 임시 개방**: 비어 있는 점포를 주말 하루 팝업으로 무료 빌려준다(청년 셀러, 독립서점, 굿즈, 플리마켓). 임대료 대신 \"손님을 데려오는 것\"으로 교환한다.\n6. **저녁·야간 한 구역만**: 시장 전체가 아니라 한 골목만 금요일 저녁에 연다. 기존 상인은 참여 선택제로 하고, 참여 상인이 성과를 보면 자연스럽게 늘어난다.\n7. **셔터 아트**: 닫힌 셔터를 지역 미대생·청년 작가가 무료로 그린다. 사진 명소가 되고, 재료는 지자체·페인트 후원으로 해결한다.\n8. **시장 안 빈 공간 공유**: 상인 휴무일이나 오후 한가한 시간에 가게 앞 작은 테이블을 청년 팝업 카페에 빌려준다.\n\n### 3. 젊은 층이 좋아하는 콘텐츠 만들기\n9. **\"할머니 레시피\" 콘텐츠**: 상인의 손맛·사연을 청년이 짧은 영상으로 만든다. 상인이 주인공이 되어 자부심이 생기고, 변화 저항이 줄어든다.\n10. **레트로·로컬 챌린지**: \"우리 동네 시장 하루 1만원 챌린지\" 같은 해시태그 참여형 이벤트. 상금 대신 상인 후원 상품(떡, 과일 등)을 준다.\n11. **지역 유튜버·인플루언서 협업**: 예산 대신 \"무료 시식·체험\"으로 교환한다. 지역 출신 크리에이터나 대학 동아리를 우선 접촉한다.\n12. **시장 굿즈 / 로고**: 디자인 전공 학생과 공모전으로 시장 로고·장바구니를 만든다. 학생에게는 포트폴리오, 시장에는 브랜드가 생긴다.\n\n### 4. 사람과 관계로 오게 하기\n13. **대학 동아리·청년 모임 연결**: 동아리 MT 장보기, 요리 동아리의 재료 미션, 사진 동아리 출사지 등으로 시장을 배정한다.\n14. **\"시장에서 저녁 먹기\" 소모임**: 지역 청년 커뮤니티(독서모임, 러닝크루)가 정기 모임 장소로 시장을 쓴다.\n15. **청년 사장님 1호점**: 젊은 상인 1~2명이 작게 입점한다(빈 점포 무상 임대 + 초기 3개월 면제). 기존 상인과 같이 쓰는 메뉴(예: 시장 재료를 사용한 메뉴)로 갈등을 줄인다.\n16. **\"단골 상인 소개\" 릴레이**: 청년이 한 가게를 방문하면 그 가게 상인이 다음 가게를 추천한다. 상인 간 연결이 생기고 방문이 이어진다.\n\n### 5. 상인의 저항을 줄이는 방식\n17. **시범 → 숫자 공개 → 확산**: 한 달 소규모로 하고 매출 변화를 함께 확인한다. 말이 아니라 숫자로 설득한다.\n18. **선택 참여·빠지기 자유**: 강요하지 않고 \"해보시겠어요\"로 시작한다. 참여 가게에 눈에 띄는 표식(스티커)을 붙여 자연스러운 경쟁심을 유도한다.\n19. **가장 영향력 있는 상인 1~2분 먼저 설득**: 시장 분위기를 좌우하는 분을 먼저 파트너로 삼는다.\n20. **상인이 주인공인 행사**: \"상인 사진전\", \"명인 소개\" 등 상인의 자부심을 건드려 참여 동기를 만든다.\n\n## 예산 없이 재원 마련\n- 지자체 전통시장 활성화·청년 상권 사업, 문화관광 공모 활용\n- 청년센터·대학 산학협력단·사회공헌 프로그램 인력 연결\n- 지역 은행·기업 후원(현물: 상품권, 인쇄, 페인트)\n- 참여 가게 수수료 없이 \"현물 교환\"(홍보 ↔ 시식/할인)\n\n## 추천 시작 순서 (4주)\n1. 1주차: 열린 상인 3~5곳 섭외, 대학생 큐레이터 팀 모집\n2. 2주차: 가게 촬영·지도 제작, 1만원 투어 코스 확정\n3. 3주차: SNS 게시 시작, 대학 동아리 2~3곳 초청\n4. 4주차: 첫 주말 미니 이벤트(셔터 아트 또는 빈 점포 팝업), 방문자·매출 간단 기록\n5. 이후 결과를 상인회에 공유하고 참여 상인 확대\n\n## 주의할 점\n- 상인에게 \"바꿔야 한다\"는 말은 피하고, \"손님이 더 온다\"는 결과 중심으로 이야기한다.\n- 위생, 소음, 쓰레기 등 기존 상인과의 마찰 요소는 사전에 규칙을 정한다.\n- 한 번의 이벤트보다 매주 반복되는 작은 이유(고정 요일·고정 코스)가 재방문을 만든다."}, {"id": "D1", "domain": "물리 제품", "problem": "배달 음식 포장 용기를 개선하고 싶어요. 국물 없는 튀김류인데, 따뜻하게 유지하면 김이 차서 눅눅해지고, 김을 빼면 금방 식어요. 용기 단가는 지금보다 올리고 싶지 않아요. 아이디어 좀 내주세요.", "A": "# 튀김 배달 용기: 따뜻함은 지키고 눅눅함은 막는 아이디어\n\n## 1. 추천 3안 + 와일드카드\n\n전제(되물을 수 없어 가정함): 배달 20~30분, 지금 용기는 뚜껑 달린 일반 플라스틱/종이 박스, \"단가 유지\"는 개당 재료비 기준(금형·칼날 수정 같은 1회성 비용은 별개)으로 봤습니다.\n\n### 안 1. 김이 스스로 여닫는 뚜껑\n- **한 줄 요약:** 뚜껑에 U자 칼집을 내 손톱만 한 작은 문을 만듭니다. 김이 차서 안쪽 압력이 오르면 문이 살짝 들려 김만 빠지고, 김이 줄면 제 무게로 닫혀 열을 지킵니다.\n- **왜 뻔하지 않은가:** 흔한 답인 '뚜껑에 구멍 뚫기'는 구멍이 늘 열려 있어 따뜻함도 계속 샙니다. 이건 김이 많을 때만 열리고 평소엔 닫혀 있습니다. 재료는 그대로이고 칼날 모양만 바뀝니다.\n- **한계:** 뚜껑이 두껍고 뻣뻣하면 문이 안 열리고, 문이 너무 크거나 헐거우면 그냥 구멍이 됩니다. 배달 가방 안에서 눌려 막힐 수도 있습니다.\n- **첫 실험:** 기존 뚜껑에 커터로 U자 칼집 2곳(지름 약 15mm)을 손으로 내서 씁니다. 같은 솥에서 나온 튀김을 번갈아 20인분 담습니다(칼집 뚜껑 10, 기존 뚜껑 10). 25분 뒤 열어, 어느 쪽인지 모르는 3명이 눅눅함을 1(바삭)~5(눅눅)로 채점하고 튀김 표면 온도를 잽니다. **성공:** 칼집 쪽 평균이 1점 이상 낮고 온도 차가 3℃ 이내. **실패:** 점수 차가 0.5점 미만이거나 온도가 5℃ 이상 더 떨어짐. 하루에 다 하면 주방 온도 영향이 같아 비교가 공정합니다. 흐리게 만들 요인은 튀김 솥마다 다른 수분이라서, 반드시 한 솥에서 번갈아 담습니다.\n\n### 안 2. 물방울이 튀김에 닿지 않는 '처마' 뚜껑\n- **한 줄 요약:** 뚜껑 안쪽을 지붕처럼 양옆으로 기울이고 가장자리에 작은 물길 턱을 둡니다. 뚜껑에 맺힌 물이 튀김 위로 떨어지지 않고 옆벽을 타고 내려갑니다.\n- **왜 뻔하지 않은가:** 흔한 답인 '흡수지 깔기'는 물을 빨아들여 없애려 하지만, 이건 물이 그대로 있어도 튀김과 만나지 않게 길을 정해 줍니다. 창틀 결로 홈, 처마의 빗물 받이와 같은 방식입니다. 눅눅함의 큰 원인은 김 자체보다 뚜껑에서 떨어지는 물방울입니다.\n- **한계:** 라이더가 용기를 크게 기울이면 물이 튀김 쪽으로 쏠립니다. 뚜껑 안면이 물을 방울로 튕기는 재질이면 경사만으로는 부족해서 김서림 방지 처리가 더 필요할 수 있습니다. 뚜껑 성형 틀을 다시 만들어야 합니다.\n- **첫 실험:** 투명 파일 조각을 기존 뚜껑 안쪽에 A자 지붕으로 접어 테이프로 붙이고 가장자리에 턱을 만듭니다. 하루 8쌍씩 2일(총 16쌍, 붙인 뚜껑 vs 그대로), 25분 뒤 열어 튀김 위 젖은 점 개수를 세고 눅눅함을 채점합니다. **성공:** 젖은 점이 50% 이상 줄고 점수가 0.8점 이상 개선. 요일·실내 온도 차이를 줄이려고 두 날을 다른 요일로 잡되, 같은 날엔 쌍으로 비교합니다.\n\n### 안 3. 뚜껑을 미리 데워서 쓰기\n- **한 줄 요약:** 포장 직전 뚜껑과 용기를 튀김기 옆 열 닿는 곳에 몇 분 올려 미지근~따뜻하게 만들어 둡니다. 차가운 벽에 김이 물로 맺히는 것 자체를 줄입니다.\n- **왜 뻔하지 않은가:** 흔한 답인 '이중벽 단열 용기'는 열이 나가는 걸 막는 방식이고, 이건 물이 맺히는 벽 자체를 데워서 애초에 맺히지 않게 합니다. 용기 값은 0원 그대로이고 주방 동작 한 가지만 추가됩니다.\n- **한계:** 겨울이나 배달 중 식은 뒤에는 효과가 사라지고, 초반 몇 분의 물방울만 줄입니다. 열에 약한 재질(일부 PS 등)은 변형될 수 있습니다.\n- **첫 실험:** 뚜껑 안쪽이 40~50℃가 되게 3분 데운 것과 상온 뚜껑을 하루 10쌍씩 2일(20쌍) 비교합니다. **성공:** 25분 뒤 뚜껑 안쪽의 젖은 면적(사진 눈대중 %)이 상온 뚜껑의 절반 이하이면서 눅눅 점수 0.5점 이상 개선. 계절·주방 온도가 변수라 두 날의 실내 온도를 같이 적어 둡니다.\n\n### 와일드카드. 김 알갱이만 통과시키는 작은 창\n- **한 줄 요약:** 뚜껑의 작은 창에 물방울과 열은 막고 수증기만 통과시키는 얇은 막(등산복 소재 같은 것)을 붙입니다.\n- **왜 뻔하지 않은가:** 구멍이나 흡수지는 없고, 대신 김만 골라 내보내는 문이 하나 있습니다. 의료용 상처 드레싱과 등산복이 쓰는 방식입니다.\n- **한계:** 단가 조건을 못 지킬 가능성이 큽니다. 그래서 추천이 아니라 와일드카드입니다. 막이 기름에 막히면 기능이 떨어지고, 견적 전에는 개당 얼마인지 모릅니다.\n- **첫 실험:** 시중 투습방수 원단 5cm 조각을 뚜껑 구멍 2곳에 테이프로 붙여 20쌍 비교합니다. **성공:** 눅눅 점수 1.5점 이상 개선, 온도 차 3℃ 이내이며 견적이 지금 뚜껑 값 이하. 기름진 튀김 때문에 막이 막히는지가 변수라 마지막 쌍은 기름이 많은 튀김으로 따로 봅니다.\n\n## 2. 다음 행동\n- **내일 바로:** 안 3(뚜껑 예열)부터 하루 10쌍 실험. 돈이 안 들고 금형 수정도 없어서 가장 싸게 확인됩니다.\n- **이어서:** 안 1·안 2를 손 제작 버전으로 확인하고, 되면 두 개를 한 뚜껑에 합칩니다(물길 지붕 + 압력 문).\n- 결과가 다 시원찮으면 더 넓게 40가지 방향을 전부 훑어 다시 만들어 볼 수 있습니다.\n\n## 3. 근거\n\n**가정:** 단품 튀김(국물 없음), 배달 20~30분, 뚜껑 있는 일회용 용기, 용기 단가 = 개당 재료비, 가게에는 적외선 온도계(1만 원 안팎)를 살 수 있음. 이미 해본 것은 몰라 아래 흔한 답을 전부 뻔한 답 목록에 넣음.\n\n**기능 문장:** \"튀김이 먹는 순간까지 따뜻하고 바삭한 채로 도착하게 한다.\" ('왜'를 2번 올려 봄: 용기를 고친다 → 먹을 때 바삭해야 한다 → 재주문·평점 유지. 더 넓은 목표에서는 식어도 바삭한 튀김옷이 답이 될 수 있어 보조 아이디어로 내림.)\n\n**모순:**\n- 기술적: 보온을 올리면(A) 눅눅해지고(B), 김을 빼면 반대로 식는다.\n- 물리적: 용기 안 공기는 갇혀 있어야 하고(열 보존) 동시에 빠져나가야 한다(김 배출).\n- 이상적 최종 결과: 튀김이 스스로 열은 간직하고 물기만 내보낸다.\n- 공짜 자원: 조리 직후 튀김의 열, 튀김기 옆 남는 열, 김의 압력, 뚜껑 안쪽 넓은 면, 포장 대기 1~2분, 라이더 가방의 진동·기울기, 뜨거운 소스컵.\n\n**추천안과 모순 연결:**\n- 안 1: 조건 분리. 김이 많을 때만 열고 아니면 닫음으로 \"갇힘/빠짐\"을 나눔.\n- 안 2: 공간 분리. 열은 튀김 주위에 두고, 물은 튀김 바깥 홈으로 보냄.\n- 안 3: 시간 분리. 응결이 심한 초반 몇 분 동안만 벽을 데워 물이 맺히지 않게 함.\n- 와일드카드: 수준 분리(막 전체는 닫혀 있고 알갱이 수준에서만 김이 통과). 단가 조건을 못 풀 수 있음.\n\n## 4. 평가표 (1~5)\n\n| 후보 | 참신도 | 이상성 | 실현성 |\n|---|---|---|---|\n| 안 1 압력 문 뚜껑 | 3 | 3 | 4 |\n| 안 2 처마 뚜껑 | 4 | 4 | 3 |\n| 안 3 뚜껑 예열 | 3 | 3 | 5 |\n| 와일드카드 투습 창 | 4 | 4 | 2 |\n| 도넛 배열 굴뚝 | 2 | 2 | 4 |\n| 소스컵 열원 | 3 | 2 | 4 |\n| 재튀김 마감 10초 | 2 | 3 | 3 |\n| 경첩 뚜껑(개봉 시 낙수 방지) | 2 | 2 | 3 |\n| 식어도 바삭한 튀김옷 | 3 | 4 | 3 |\n\n참신도 4점은 9개 중 2개입니다. 5점은 없습니다. 안 2는 \"물을 없애지 않고 튀김과 안 만나게 하는 길을 낸다\"는 점에서 흔한 답과 다르다고 봐서 4점, 안 1은 구멍의 변형에 가까운 면이 있어 3점으로 깎았습니다.\n\n## 5. 부록\n\n### 뻔한 답 목록 (금지 목록)\n1. 뚜껑에 통기구멍 뚫기\n2. 흡수지·유산지·키친타월 깔기(흡수)\n3. 이중벽·단열 소재 용기\n4. 실리카겔 같은 흡습제 패드\n5. 바닥에 격자·받침대로 튀김 띄우기\n6. 소스·수분 곁들이 분리 포장\n7. 보온 배달 가방·보온팩\n8. 포장 전 잠깐 식히기/재가열 안내(에어프라이어)\n\n### 발산 로그 (태그 = 그 원리의 질문에서 출발한 것)\n- #1 [2 추출] 물방울이 맺히는 뚜껑 안면을 떼어 '물길'로 유도 — 흐름 유도 (안 2)\n- #2 [2 추출] 김의 주 공급원(양배추·치킨무)을 튀김 옆에서 빼기 — 수분원 제거 (8번 변형)\n- #3 [7 포개기] 튀김을 도넛 고리로 두르고 가운데를 김 통로로 — 중앙 굴뚝 대류\n- #4 [6 범용성] 뜨거운 소스컵을 열원 겸 기둥으로 — 소스 열로 주변 공기 데움\n- #5 [33 동질성] 튀김옷과 같은 재질의 시트를 바닥에 깔아 김 흡수 — 흡수 (2번 변형)\n- #6 [9 사전 반대조치] 뚜껑 안면 김서림 방지 코팅 — 물방울 대신 물 막으로 흘려보냄 (안 2와 같은 원리)\n- #7 [9 사전 반대조치] 마지막에 뜨거운 기름에 10초 재튀김 — 표면 수분 미리 제거\n- #8 [10 사전 조치] 뚜껑·용기를 미리 데워 둠 — 벽 온도를 이슬점 위로 (안 3)\n- #9 [22 전화위복] 뚜껑 안쪽 반사 코팅으로 김 열을 튀김 쪽으로 되돌림 — 복사열 반사 (3번 변형)\n- #10 [25 셀프서비스] 김 압력으로 스스로 열리고 닫히는 칼집 문 — 조건부 개폐 (안 1)\n- #11 [37 열팽창] 뜨거운 공기가 팽창해 뚜껑이 들리고 식으면 닫힘 — #10과 같은 원리\n- 스윕 SKIP: 19번은 원래 없이 10번으로 대체, 36 상전이(SKIP: 잠열 소재는 단가 초과), 나머지 방향 원리는 이 스윕에서 선택되지 않음.\n- 극단화 [STC 비용 ∞] 진공 단열 보온 용기 — 단열 (3번 변형)\n- 극단화 [STC 시간 ∞] 식어도 바삭한 튀김옷(전분·쌀가루 비율 조정) — 수분 이동 억제 (용기 밖)\n- 극단화 [거꾸로: 더 눅눅하게 하려면 → 뚜껑 안면을 평평하게 해 물이 튀김 위로 떨어지게] 뒤집기 → 지붕 경사 — 안 2와 같은 원리\n- 극단화 [먼 분야: 의료 드레싱·등산복의 투습막] 김 알갱이만 통과 — 선택 투과막 (와일드카드)\n- 극단화 [먼 분야: 한식 찜기 뚜껑 면포] 면포로 물방울 흡수 — 흡수 (2번 변형)\n- 극단화 [전제 뒤집기: 누가/언제] 도착 순간이 아니라 '개봉 순간'만 바삭하면 됨 → 경첩 뚜껑으로 열 때 낙수 방지 — 개봉 시 낙수 차단\n- 극단화 [전제 뒤집기: 누가] 고객에게 \"먼저 뚜껑 반쯤 여세요\" 라벨 — 도착 후 김 빼기를 고객에게 넘김\n\n### 다리 놓기 (가장 황당한 3개 → 핵심 메커니즘 → 현실 버전)\n1. \"뚜껑이 식물 잎 기공처럼 스스로 숨쉰다\" → 조건(압력)에 따라 여닫음 → 칼집 압력 문 (안 1)\n2. \"물방울이 모일 전용 미끼 표면을 용기에 만든다\" → 물이 갈 곳을 미리 정해 줌 → 처마 뚜껑 (안 2)\n3. \"용기를 오븐에서 막 꺼낸 그릇처럼 뜨겁게\" → 벽이 뜨거우면 김이 안 맺힘 → 뚜껑 예열 (안 3)\n\n### 유사성 검사 (가장 비슷한 무난한 답 / 작동 원리가 다른 점)\n- 안 1: 뚜껑 구멍 / 구멍은 항상 열려 열이 새지만 이건 김 압력이 높을 때만 열림\n- 안 2: 흡수지 / 물을 없애지 않고 튀김과 만나지 않게 길을 정함\n- 안 3: 단열 용기 / 열 유출 차단이 아니라 물이 맺히는 벽 온도를 올려 응결 억제\n- 와일드카드: 뚜껑 구멍 / 구멍 없이 막이 김만 골라 통과시킴 (단, 단가 리스크)", "B": "# 튀김류 배달 포장 용기 개선 아이디어 (단가 동결)\n\n## 가정\n- 대상: 국물 없는 튀김(치킨, 돈가스, 탕수육 등), 배달 시간 20~40분.\n- \"단가 유지\"는 용기 1개당 원가가 현재 이하라는 뜻. 소재를 바꾸더라도 총원가는 같거나 낮아야 함.\n- 현재 용기는 일반 종이/PP 밀폐형 또는 반밀폐형으로 가정.\n\n## 핵심 문제\n보온(열 유지)과 배습(수증기 배출)이 충돌한다. 밀폐하면 수증기가 응축돼 눅눅해지고, 열어 두면 열이 빠르게 빠진다. 핵심은 \"수증기는 빼고 열은 가두는 것\", 그리고 \"응축수가 튀김에 닿지 않게 하는 것\"이다.\n\n## 아이디어\n\n### 1. 수증기가 빠지는 위치를 분리한다 (구조)\n- 뚜껑 상단 가장자리에 작은 미세 구멍/슬릿을 낸다. 뜨거운 수증기는 위로 올라가므로 상단 배기만 열어도 배습은 되고, 열린 면적이 작아 열 손실은 제한적이다.\n- 구멍을 뚜껑 중앙이 아닌 모서리에 두고 계단형(라비린스) 구조로 만들면 찬 공기 유입은 줄이고 수증기만 빠진다. 금형 수정만으로 가능해 재료비가 늘지 않는다.\n\n### 2. 응축수가 튀김에 닿지 않게 한다\n- 바닥에 엠보싱/돌기 패턴을 넣어 튀김이 바닥 기름·수분과 떨어지게 띄운다. 금형 변경만으로 되며 재료 추가가 없다.\n- 뚜껑 안쪽을 경사지게(돔형) 성형해 맺힌 물방울이 튀김 위로 떨어지지 않고 벽면으로 흘러내리게 한다.\n- 용기 벽 하단에 응축수가 고이는 얕은 홈(트랩)을 만든다.\n\n### 3. 소재 자체가 습기를 처리한다\n- 바닥·내부에 흡습/흡유 성질이 있는 펄프 몰드 라이너를 쓰고 기존 플라스틱 내부 트레이를 뺀다. 트레이 제거분으로 원가를 상쇄한다.\n- 뚜껑 안쪽에 결로 방지(anti-fog) 코팅을 하되, 코팅 면적을 최소화해 단가 상승을 막는다.\n- 골판지 마이크로 플루트 구조를 이중벽 단열로 활용한다. 공기층이 단열재 역할을 하므로 별도 단열재가 필요 없다.\n\n### 4. 열은 가두고 습기만 가두지 않는다\n- 반밀폐 이중 구조: 안쪽 트레이는 통기, 바깥 박스는 단열. 두 겹이지만 안쪽을 종이 한 장으로 하면 비용은 비슷하다.\n- 용기 크기를 내용물에 맞춰 줄인다. 빈 공간(헤드스페이스)이 작을수록 수증기가 적게 고이고 열도 오래 간다. 재료 사용량이 줄어 단가가 내려가는 방향이다.\n- 검정 등 열 흡수가 좋은 색이나 반사 내면은 효과가 제한적이므로 우선순위는 낮다.\n\n### 5. 운영으로 푸는 방법 (용기 단가와 무관)\n- 튀김 직후 30~60초 식힌 뒤 포장하면 초기 수증기량이 크게 준다. 조리 동선 변경만으로 가능하다.\n- 소스·양념은 분리 포장하고, 눅눅함에 민감한 품목은 종이 위에 올려 담는다.\n- 배달 요청 시 \"바삭 모드\" 안내 문구를 넣어 수령 후 뚜껑을 열도록 유도한다.\n\n## 추천 조합 (단가 동결 우선)\n1. 뚜껑 모서리 배기구 + 돔형 뚜껑(응축수 유도) — 금형 수정만 필요\n2. 바닥 엠보싱으로 튀김 띄우기 — 금형 수정만 필요\n3. 용기 크기 최적화 — 재료 절감으로 다른 개선의 비용을 상쇄\n4. 조리 후 짧은 뜸(식힘) 운영\n\n## 검증 제안\n- 동일 튀김을 현행 용기와 개선 용기에 담아 30분 후 표면 온도와 바삭함(관능 평가, 수분 함량)을 비교한다.\n- 배기구 크기를 2~3단계로 나눠 시험해 보온과 배습의 균형점을 찾는다.\n\n## 한계\n- 위 수치와 효과는 일반 원리에 기반한 것으로, 실제 용기 소재·배달 시간·튀김 종류에 따라 시험이 필요하다.\n- 소재 교체는 공급사 견적에 따라 단가가 달라질 수 있어 확인이 필요하다."}, {"id": "H2", "domain": "AI 개발도구", "problem": "AI 코딩 에이전트가 큰 코드베이스에서 요청과 상관없는 파일을 자꾸 건드려요. 수정 가능한 범위를 좁게 제한하면 정작 필요한 수정도 못 해서 실패하고요. 새로운 해결 방식이 있을까요?", "A": "# 코딩 에이전트의 범위 이탈 vs 필요한 수정 실패: 새로운 해결 방식\n\n## 가정\n- 에이전트는 Claude Code, Codex 같은 도구이고, 파일 편집 권한과 훅을 설정할 수 있다고 가정합니다.\n- 코드베이스에 테스트, 타입체크, git이 있다고 가정합니다.\n- \"범위를 좁게 제한\"은 지금 허용 경로 목록(allowlist)을 미리 고정하는 방식이라고 이해했습니다.\n\n## 문제의 구조\n- 범위를 넓히면 관련 없는 파일을 건드립니다.\n- 범위를 좁히면 필요한 수정도 막혀서 실패합니다.\n- 원인은 \"어디까지 고칠 수 있나\"를 작업 시작 전에 한 번만 정하기 때문입니다. 필요한 범위는 작업하면서 드러나는데, 경계는 고정돼 있습니다.\n\n그래서 경계를 넓히고 좁히는 대신, 경계의 성질을 바꾸는 방향이 필요합니다.\n\n## 해결 방식\n\n### 1. 동적 범위: 좁게 시작하고, 근거를 대면 넓힌다\n- 처음에는 요청과 직접 관련된 파일만 쓰기 가능하게 둡니다.\n- 범위 밖 파일이 필요하면 막고 끝내지 않습니다. 에이전트가 \"이 파일이 필요한 이유\"를 한 줄로 제출하게 합니다.\n- 근거가 객관적으로 확인되면 자동 승인합니다. 예를 들면 다음과 같습니다.\n  - 수정 대상이 import하거나 호출하는 파일\n  - 실패한 테스트나 타입 오류가 가리키는 파일\n- 근거가 약하면 사람에게 넘깁니다.\n- 이렇게 하면 필요한 수정은 통과하고, 관련 없는 수정은 근거를 댈 수 없어 걸러집니다.\n\n### 2. 의존 그래프로 허용 범위를 자동 계산\n- 사람이 경로를 나열하지 않고, 코드 그래프(import, 호출, 테스트 매핑)에서 \"변경 대상의 1~2단계 이웃\"을 허용 범위로 계산합니다.\n- 범위가 요청에 맞춰 자동으로 달라집니다. 큰 코드베이스일수록 효과가 큽니다.\n- 그래프 밖 파일은 2번 방식처럼 근거 제출을 요구합니다.\n\n### 3. 쓰기 제한 대신 사후 변경 검증\n- 편집은 막지 않고, 격리된 워크트리나 브랜치에서 작업하게 합니다.\n- 종료 시점에 diff를 검사합니다.\n  - 요청과 연결되지 않는 변경 파일은 되돌립니다.\n  - 파일별로 \"왜 바꿨나\"를 요청 항목에 매핑해서 매핑되지 않는 변경은 제거합니다.\n- 실패하지 않고 정리만 되므로, 필요한 수정이 막혀서 죽는 일이 없습니다.\n\n### 4. 최소 변경을 목표로 하는 검증기\n- 테스트가 통과하는 변경 중 가장 작은 것을 선호합니다.\n- 각 변경 파일을 되돌려도 테스트가 통과하면 그 변경은 불필요한 것으로 보고 제거합니다. (파일 단위 제거 실험)\n- 사람이 범위를 판단하는 대신 테스트가 필요성을 증명합니다.\n\n### 5. 계획 먼저, 파일 목록 합의\n- 수정 전에 에이전트가 \"바꿀 파일과 이유\" 계획을 냅니다.\n- 계획에 없는 파일을 수정하려 하면 계획 갱신을 요구합니다. 막는 게 아니라 기록과 재승인을 거치게 하는 방식입니다.\n\n## 추천 조합\n1. 기본: 2번(의존 그래프 기반 초기 범위) + 1번(근거 제출 시 확장)\n2. 안전망: 3번(격리 워크트리에서 작업하고 종료 시 diff 정리)\n3. 선택: 4번(불필요한 변경 제거 실험)은 테스트가 충실한 저장소에서만 사용합니다.\n\n이 조합은 처음에는 좁게 시작하고, 필요가 확인될 때만 범위가 넓어지며, 끝난 뒤에도 남은 불필요한 변경을 정리합니다.\n\n## 도입 순서\n1. 먼저 3번(워크트리와 diff 검사)을 적용합니다. 가장 쉽고 위험이 낮습니다.\n2. 이탈이 자주 나는 경로를 로그로 모아서 2번의 그래프 규칙을 만듭니다.\n3. 훅으로 범위 밖 쓰기를 차단하되 \"근거 제출\" 경로를 열어 1번으로 확장합니다.\n\n## 주의\n- 자동 승인 기준(import 관계, 실패 테스트 등)이 너무 느슨하면 다시 범위가 퍼집니다. 승인 로그를 주기적으로 보고 기준을 조정하세요.\n- 동적 생성 코드나 설정 파일 같은 암묵적 의존은 그래프에 안 잡힙니다. 이런 파일은 \"항상 사람 확인\" 목록으로 따로 관리하세요.", "B": "# AI 코딩 에이전트가 요청과 무관한 파일을 건드리는 문제 — 새 접근 (빠르게 모드)\n\n**가정:** 코드베이스에 자동 테스트가 어느 정도 있고, 같은 요청을 여러 번 돌릴 토큰 예산은 있다. 이미 해본 \"수정 범위를 좁게 제한\"은 흔한 답 목록에 넣었다. 모드를 따로 말하지 않으셔서 기본(빠르게)으로 진행했다.\n\n## 1. 추천 3안 + 와일드카드\n\n**추천 1. 넓게 시켜 놓고, 끝난 뒤 필요한 조각만 남긴다**\n- 요약: 에이전트가 어디든 고치게 두고, 결과물을 조각(수정 덩어리)으로 나눈 뒤 조각을 하나씩 되돌려 본다. 요청을 검증하는 테스트가 그래도 통과하면 그 조각은 불필요하니 자동으로 뺀다.\n- 왜 뻔하지 않은가: 흔한 답인 \"작업 후 사람이 diff를 검토\"는 사람의 눈으로 걸러낸다. 이 안은 실행 결과로 걸러내고 범위는 사전에 정하지 않는다. 그래서 필요한 수정이 막혀 실패하는 일이 없다.\n- 한계: 요청을 검증하는 테스트가 없거나 느리면 못 쓴다. 테스트가 잡지 못하는 필요한 수정(문서, 설정, 타입 선언)까지 지울 위험이 있어 \"테스트 밖 조각은 삭제하지 말고 표시만\" 해야 한다.\n- 첫 실험: 종이 버전(수작업)으로 한다. 최근 에이전트 PR 20개를 골라 한 사람이 조각별로 되돌려 보며 테스트를 돌린다. 비교 대상은 원래 PR 그대로다. 성공은 \"테스트 통과율 100% 유지 + 무관하다고 판정된 파일 수 50% 이상 감소\", 실패는 그 미만이다. 결과를 흐릴 요인은 PR 난이도 차이인데, 같은 PR의 원본과 삭감본을 짝지어 비교하므로 상쇄된다. 무관 여부는 2인이 따로 판정한다.\n\n**추천 2. 같은 요청을 5번 돌려서, 매번 나온 수정만 채택한다**\n- 요약: 같은 요청을 독립적으로 5번 실행한다. 5번 모두에 등장한 파일 수정만 채택한다. 필요한 수정은 매번 반복되고, 엉뚱한 곳을 건드리는 것은 실행마다 제각각이라는 성질을 이용한다.\n- 왜 뻔하지 않은가: 흔한 답은 \"건드리지 말 곳을 미리 알려 준다\"이다. 이 안은 어디가 무관한지 사람이 몰라도 된다. 무관한 수정이 자기들끼리 일치하지 않는다는 점으로 저절로 골라낸다.\n- 한계: 유효한 해법이 여러 개라 실행마다 다르게 고치는 요청에는 필요한 수정도 탈락한다. 포맷터 실행처럼 매번 똑같이 생기는 부수 수정은 못 거른다. 비용이 5배다.\n- 첫 실험: 요청 10개를 각각 5번 돌려(수동으로 세션 5개) 파일별 등장 횟수를 센다. 비교 대상은 1회 실행 결과다. 성공은 \"5회 공통본이 요청 테스트를 통과하고 무관 파일 수가 1회 결과 대비 50% 이상 감소\", 실패는 그 미만이다. 교란 요인은 포맷터 같은 체계적 부수 수정이므로 이런 파일은 따로 세어 결과에서 분리한다.\n\n**추천 3. 파일이 아니라 \"고치는 방식\"을 제한한다 (함수·이름 단위 편집)**\n- 요약: 에이전트의 편집 도구를 \"이 함수 본문을 바꿔라\", \"이 이름을 바꿔라\" 같은 단위 명령만 받게 한다. 파일은 어디든 열려 있지만, 파일 통째 재작성으로 생기는 포맷 변경·임포트 정리·주변 함수 수정은 구조적으로 불가능해진다.\n- 왜 뻔하지 않은가: 흔한 답인 \"허용 파일 목록\"은 어디를 고칠 수 있는지를 막는다. 이 안은 어떻게 고치는지를 바꾼다. 다른 모듈의 함수 하나가 꼭 필요하면 그 함수만 정확히 고칠 수 있다.\n- 한계: 함수 밖(설정 파일, 전역 상수, 스타일 파일) 수정이 잦은 작업에는 맞지 않는다. 편집 도구를 만드는 비용이 든다.\n- 첫 실험: 개발 전에 종이로 시뮬레이션한다. 최근 에이전트 PR 20개에서 변경 줄을 두 사람이 \"필요/무관\"으로 표시한다. 성공은 \"무관 줄의 60% 이상이 함수 본문 밖에 있고, 필요한 줄의 90% 이상이 함수 본문 안에 있음\", 실패는 그 미만이면 폐기한다. 비교 대상은 현재 방식의 PR이고, 교란 요인은 라벨러 편향이라 2인 독립 표시로 줄인다.\n\n**와일드카드. 코드에 미끼 파일을 심어 \"딴 데 손대는 버릇\"을 잰다**\n- 요약: 요청과 무관하지만 이름이 그럴듯한 미끼 파일(예: 안 쓰는 `legacy_helpers`)을 몇 개 심는다. 에이전트가 미끼를 건드리는 비율로 프롬프트·모델 설정별 이탈 성향을 점수화하고, 성향이 낮은 설정에만 넓은 권한을 준다.\n- 왜 뻔하지 않은가: 흔한 답은 모든 에이전트를 똑같이 묶는다. 이 안은 묶지 않고 재서 신뢰한 만큼 푼다.\n- 한계: 미끼가 사람 개발자를 헷갈리게 한다. 에이전트가 미끼임을 알아채면 측정이 무의미하다. 측정만 하고 무관 수정 자체는 줄이지 못한다.\n- 첫 실험: 테스트용 저장소 복사본에 미끼 3개를 심고, 같은 요청 20개를 두 가지 프롬프트 설정(현재 방식 vs 대안)으로 돌려 미끼 접촉률을 비교한다. 성공은 \"두 설정의 접촉률 차이 10%p 이상이고, 접촉률과 실제 무관 수정 파일 수의 상관이 0.5 이상\", 실패는 그 미만이다. 교란 요인은 요청 종류 편중이라 두 설정에 같은 요청 20개를 쓴다.\n\n**보조 아이디어 (추천 자리에 못 앉은 것):** ① 막힌 수정 시도를 기록해 범위가 실패에서 자라게 하기(다음 유사 요청부터 자동 포함). ② 무관 수정을 버리지 않고 \"별도 제안 PR\"로 갈라내기. ③ 실패하는 테스트를 사람이 확인한 뒤 시작하기.\n\n## 2. 다음 행동\n\n먼저 추천 1과 3의 종이 실험을 같은 PR 20개로 한 번에 한다(1~2시간). 두 결과가 다 좋으면 1을 먼저 도구화한다. 테스트가 부실한 저장소면 2부터 한다. 결과가 빈약하면 \"깊게\" 모드로 올릴지 알려 달라.\n\n## 3. 근거: 문제 재정의와 모순\n\n- **기능 문장:** 요청을 이루는 데 필요한 변경만 결과물에 남긴다. (\"왜?\" 2번: 범위를 왜 제한하나 → 무관 변경이 섞이지 않게 → 왜? → 사람이 결과를 믿고 반영하려고. 그래서 \"반영되는 변경이 요청과 정확히 일치한다\"로 넓혔고, 이 목표는 사전 제한이 아니라 사후 판정으로도 풀린다.)\n- **물리적 모순(하나의 요소가 상반된 요구):** 수정 범위는 좁아야(무관 파일 보호) 하고 동시에 넓어야(필요한 수정 허용) 한다. 기술적 표현: 안전성을 높이면 성공률이 떨어진다.\n- **IFR(이상적 최종결과, 장치 없이 목적이 저절로 달성됨):** 요청에 필요한 변경만 저절로 결과물에 남고 나머지는 사라진다.\n- **자원:** 테스트 결과(통과/실패), 남는 실행 시간·토큰, 에이전트의 여러 번 실행 결과, git 이력의 함께 바뀐 파일, 실패·거부 로그, 컴파일러 오류.\n- **추천안과 연결:**\n  - 추천 1: 시간 분리. 작업 중엔 넓게, 결과물은 좁게.\n  - 추천 2: 시간 분리. 각 실행은 넓게, 채택 단계에서 좁게(IFR의 \"나머지는 저절로 사라진다\"를 다수결로 구현).\n  - 추천 3: 수준 분리. 파일 수준은 열고, 줄 수준은 좁게.\n  - 와일드카드: 조건 분리. 성향 점수에 따라 범위를 다르게. 모순을 직접 풀지는 못하고 측정을 통해서만 푸는 안이라 와일드카드로만 둔다.\n\n## 4. 평가표 (참신도·이상성·실현성, 1~5)\n\n| 후보 | 가장 비슷한 무난한 답 / 작동 원리가 다른 점 | 참신 | 이상 | 실현 |\n|---|---|---|---|---|\n| 사후 삭감 | diff 사람 리뷰 / 실행으로 조각별 필요성 판정 | 4 | 4 | 3 |\n| 5회 공통분모 | 사전 범위 지정 / 무관 수정의 불일치를 이용해 거름 | 4 | 3 | 4 |\n| 함수 단위 편집 | 허용 파일 목록 / 어디가 아니라 어떻게를 제한 | 3 | 4 | 3 |\n| 미끼 파일(와일드) | 일괄 제한 / 측정 후 신뢰만큼 권한 부여 | 4 | 2 | 3 |\n| 실패에서 범위 성장 | 파일 목록 / 목록이 실패 기록에서 자람 | 3 | 3 | 3 |\n| 별도 제안 PR 분리 | 작업 쪼개기 / 막지 않고 갈라냄 | 3 | 3 | 4 |\n| 수정마다 이유 인용 | 프롬프트 지시 / 수정마다 근거 제출 강제(선언의 변형에 가까움) | 2 | 3 | 5 |\n| 수정 예산제 | 승인 / 비용 부과(승인의 변형) | 2 | 2 | 4 |\n| 심판 에이전트 | 사람 리뷰 / 리뷰어만 AI로 교체(변형) | 2 | 3 | 4 |\n| 함수 단위 화이트리스트 | 파일 화이트리스트 / 단위만 촘촘(변형) | 1 | 3 | 4 |\n\n## 부록\n\n### 금지 목록 (뻔한 답)\n1. 허용 파일·폴더 화이트리스트 (사용자가 이미 해본 것)\n2. 프롬프트에 \"관련 없는 파일 건드리지 마\" 지시\n3. 검색·인덱스로 관련 파일만 컨텍스트에 제공\n4. 작업 후 diff 사람 리뷰·승인\n5. 보호 경로 읽기 전용 (CODEOWNERS 등)\n6. 린트·테스트 통과 강제\n7. 작업을 작게 쪼개서 시키기\n8. 별도 브랜치·워크트리에 격리\n\n### 발산 로그\n- #1 [2 추출] 파일 통째 재작성 대신 바뀌는 함수만 뽑아 편집 — 편집 단위 축소\n- #2 [31 다공질] 기본 잠금, 예외 구멍만 뚫기 — 화이트리스트 변형\n- #3 [33 동질성] 요청과 변경 판정을 같은 형식(테스트)으로 통일해 조각별 판정 — 사후 삭감\n- #4 [24 매개체] 중간 심판 에이전트가 수정 관련성 판정 — 리뷰 변형\n- #5 [34 폐기와 재생] 무관 변경 폐기, 필요 시 재생 — 사후 삭감과 같은 메커니즘\n- #6 [19 주기적 작용] N개 파일마다 멈춰 점검 — 검토 변형\n- #7 [22 전화위복] 막힌 시도를 범위 성장의 재료로 — 실패 기록으로 범위 학습\n- #8 [27 값싼 일회용] 같은 요청을 싸게 5번 돌려 공통분모만 채택 — 실행 간 합의\n- #9 [32 색·투명도] 변경 줄마다 요청 문장 출처 표시 — 근거 인용\n- #10 [36 상전이] 테스트가 실패에서 통과로 바뀌는 순간에 기여한 조각만 인정 — 사후 삭감과 같은 메커니즘\n- [21 서두르기] SKIP(권한 개념과 맞지 않음)\n- #11 [극단화: 비용 0] 테스트를 무한 실행할 수 있다면 모든 조각 조합을 시험 — 사후 삭감\n- #12 [극단화: 크기 0 + 게임 안개 유추] 코드베이스를 접힌 지도로만 보여주고 펼친 파일만 편집 — RAG 변형\n- #13 [극단화: 거꾸로 하기] 무관 수정을 늘리려면 전체 재작성·전체 포맷터 실행 → 뒤집어 함수 단위 편집·변경분만 포맷\n- #14 [전제 뒤집기: 범위는 작업 전에 정한다] 작업 후에 정한다 — 사후 삭감\n- #15 [전제 뒤집기: 범위는 사람이 정한다] 실패 기록이 정한다 — 범위 성장\n- #16 [전제 뒤집기: 무관 수정은 버려야 한다] 별도 제안함으로 갈라냄 — 분리 PR\n- #17 [먼 분야 유추: 보안 허니팟] 미끼 파일 접촉률로 이탈 성향 측정 — 측정 후 권한 부여\n- #18 [먼 분야 유추: 의료 수술 전 표시] 시작 전 실패 테스트를 사람이 확인 — 목표 고정\n- #19 [9 windows 상위 시스템] 모듈 경계를 계약 파일로 굳혀 영향권을 구조적으로 작게 — 코드 구조 개선\n- #20 [전제 뒤집기: 자유는 공짜다] 수정 파일 수에 예산을 매김 — 예산제"}, {"id": "D4", "domain": "개인·일상", "problem": "책상 위가 계속 어질러져요. 큰맘 먹고 정리해도 3일이면 원상복구됩니다. 정리 습관을 들이라는 뻔한 말 말고, 다른 방법이 없을까요?", "A": "# 책상이 3일 만에 원상복구되는 문제 — 뻔하지 않은 접근\n\n## 1. 추천 3안 + 와일드카드\n\n**추천 1. 어질러진 책상을 \"사용 기록\"으로 삼아 자리를 다시 짠다**\n- 한 줄 요약: 정리하지 말고, 3일 뒤 원상복구된 책상 사진을 찍는다. 올라와 있는 물건을 \"이 3일 안에 실제로 쓴 것 / 안 쓴 것\"으로 나눈 뒤, 쓴 것 중 상위 5개에만 손 닿는 전용 자리를 주고 나머지는 책상 밖으로 보낸다.\n- 왜 뻔하지 않은가: 흔한 답인 \"정리 습관\"이나 \"수납함 추가\"는 물건을 어디에 넣을지부터 정한다. 이 안은 어질러진 모습을 \"내가 진짜 쓰는 물건이 뭔지 알려주는 자료\"로 읽고, 거기서 자리를 정한다. 의지력을 더 요구하지 않는다.\n- 한계: 안 쓴 물건이 아니라 \"쓰고 나서 제자리에 안 돌려놓는 것\"이 원인이면 효과가 작다. 실제로 쓰는 물건이 20개를 넘는 일(자료가 많은 작업)에서도 약하다.\n- 첫 실험: 본인이 2주간 한다. 1주차는 지금 방식 그대로 월요일 저녁에 정리하고 금요일 저녁에 책상 위 물건 개수를 센다(비교 기준). 2주차는 월요일에 위 방법으로 자리를 짜고 금요일 저녁에 다시 센다. 자리 표시는 종이 라벨과 테이프로 흉내 낸다. 2주차 개수가 1주차보다 40% 이상 줄면 성공, 20% 미만이면 실패. 흐리는 요인은 두 주의 업무량 차이이므로 두 주 모두 그 주 회의 수와 서류 건수를 적어 둔다.\n\n**추천 2. 정리하지 말고, \"물건을 올려놓을 면\" 자체를 작업 때만 존재하게 한다**\n- 한 줄 요약: 책상 위를 상시 비워 두고, 일할 때만 접이식 상판이나 무릎 책상을 펼친다. 일이 끝나면 접어서 벽이나 문 뒤에 세운다. 접으려면 위가 비어야 하니, 치우는 일이 접는 동작에 저절로 붙는다.\n- 왜 뻔하지 않은가: 흔한 답인 \"서랍·선반 늘리기\"는 놓을 자리를 더 만든다. 이 안은 반대로 물건이 머물 평평한 면을 없앤다. 처음엔 책상을 없앤다는 게 엉뚱해 보이지만, 어질러짐은 결국 \"놓을 면이 있어서\" 생긴다.\n- 한계: 모니터 두 대와 키보드가 고정된 자리이거나 하루 종일 같은 자리에서 일하면 매번 펴고 접는 수고가 커진다. 접이식 상판을 이미 두고도 쌓아 두는 사람도 있다.\n- 첫 실험: 제품을 사지 않는다. 집에 있는 큰 쟁반·도마·골판지를 상판 대신 쓴다. 5일간 책상 위는 빈 채로 두고 이 판 위에서만 일한다. 비교 기준은 직전 5일(평소)이다. 5일 중 4일 이상 퇴근 시 작업 자리 위 물건이 5개 이하이고, 매일 작업 준비에 드는 시간이 3분 이하이면 성공. 3일 이하이거나 준비 시간이 5분을 넘으면 실패. 흐리는 요인은 요일(금요일에는 피곤해서 대충 함)이라 요일별로 따로 기록한다.\n\n**추천 3. 정리 = 분류라는 생각을 버리고, 분류 없이 30초에 쓸어 담는다**\n- 한 줄 요약: 작업 중 책상 위에 큰 종이(크래프트지·신문지)를 깐다. 퇴근할 때는 종이 모서리를 모아 위에 있던 것을 통째로 상자 하나에 쏟는다. 분류는 다음 날 필요한 물건을 꺼낼 때 그 자리에서 조금씩 한다.\n- 왜 뻔하지 않은가: 흔한 답인 \"큰맘 먹고 종류별로 정리\"는 정리 자체가 비싸서 3일 뒤엔 다시 하기 싫어진다. 이 안은 정리에서 가장 비싼 분류를 빼고 뒤로 미룬다. 어질러졌어도 \"치우는 비용\"이 30초라서 계속할 수 있다.\n- 한계: 상자 속이 뒤섞여 찾는 시간이 길어지면 오히려 손해다. 서류·영수증이 섞여 잃어버리는 일도 생긴다.\n- 첫 실험: 본인이 7일간 종이 한 장과 상자 하나로 한다. 비교 기준은 직전 7일(평소 정리)이다. 매일 저녁 정리에 걸린 시간과 다음 날 물건 찾는 시간을 스톱워치로 잰다. 7일 중 5일 이상 정리가 60초 이하이고 하루 물건 찾는 시간 합계가 3분 이하이면 성공. 정리가 3분을 넘거나 찾는 시간이 5분을 넘으면 실패. 흐리는 요인은 처음 며칠은 새로워서 잘하는 효과라서, 5~7일째 기록으로 판정한다.\n\n**와일드카드. 서로의 책상을 바꿔서 정리해 준다**\n- 한 줄 요약: 동료나 가족 한 명과 금요일 30분, 서로 상대 책상을 정리해 준다. 버리지는 않고 상자에 모아 둔다.\n- 왜 뻔하지 않은가: 흔한 답인 \"내가 정리하기\"는 내 물건이라 이게 필요한지 버릴지 고민하다 지친다. 남의 책상은 판단이 빨라서 정리가 순식간에 끝나고, 배치도 내가 안 하던 방식으로 바뀐다.\n- 한계: 상대가 치운 곳을 내가 못 찾을 수 있고, 서류에 민감한 내용이 있으면 못 한다. 원인을 푸는 안은 아니다. 정리 결정의 피로만 덜어 주는 안이라 와일드카드로 둔다.\n- 첫 실험: 2주 동안 금요일마다 1명과 교환한다. 비교 기준은 본인이 직접 정리했던 지난 정리다. 정리 후 3일 뒤 사진에서 물건 개수 증가폭이 본인 정리 때보다 30% 이상 작으면 성공. 차이가 10% 미만이면 실패. 흐리는 요인은 상대가 물건을 어디에 뒀는지 몰라 찾다 헤매는 경우라서, 상자 위치를 서로 메모한다.\n\n## 2. 다음 행동\n\n- 오늘: 지금 책상 사진을 한 장 찍고, 추천 1의 1주차(지금 방식 그대로 + 금요일 개수 세기)부터 시작한다. 돈도 도구도 필요 없다.\n- 이번 주말: 추천 2·3의 재료(쟁반, 종이, 상자)를 챙겨 다음 주에 하루씩 번갈아 시험한다.\n- 결과가 빈약하거나 어느 것도 안 맞으면 \"깊게\" 모드로 40개 방향을 전부 돌려 볼지 다시 물어 달라고 말해 주세요.\n\n## 3. 근거\n\n- 가정: 개인 책상(집 또는 자리 고정 사무실)이고, 어질러지는 것은 서류·소품·전자기기 잡동사니이며, 이미 해본 것은 \"큰맘 먹고 대청소\"뿐이다. 처음 정리 후 3일이 걸리는 원인은 모르니 추천 1이 원인 파악을 겸한다.\n- 기능 문장: \"일할 때 필요한 물건은 바로 손이 닿고, 쓰지 않는 물건은 의지력 없이 저절로 책상 위에서 사라진다.\" 왜?를 두 번 올리면 \"정돈\"이 목표가 아니라 \"일 시작에 걸리는 시간\"이 목표임을 알 수 있다(상위 목표: 3분 안에 일을 시작할 수 있는 책상).\n- 모순(하나의 것이 서로 반대를 요구받는 상황): 책상 위는 자주 쓰는 물건이 손닿는 곳에 있어야 하고(편의), 동시에 비어 있어야 한다(정돈). 이 둘을 시간·조건·공간으로 나누어 푸는 것이 분리다.\n- 이상적 최종결과(비용·장치 없이 저절로 목적이 이뤄진 상태): 쓰고 난 물건이 저절로 책상 밖으로 나가고, 책상엔 지금 쓰는 것만 있다.\n- 이미 공짜인 자원: 동료·가족의 눈, 퇴근 후 비는 책상 시간, 쌓인 물건 사진(=사용 기록), 벽·문 뒷면의 빈 공간, 택배 상자·종이 같은 버려지는 것.\n- 추천안과 모순의 연결:\n  - 추천 1: 조건 분리 — \"실제 쓰는 상위 물건만 손닿는 곳, 나머지는 밖\".\n  - 추천 2: 시간 분리 — \"일하는 동안만 면이 있고, 안 쓰는 동안은 면이 없음\".\n  - 추천 3: 시간 분리 — 정리의 \"분류 완벽성\"은 사용 시점으로 미루고, 정리 시점에는 30초짜리로 끝냄.\n  - 와일드카드: 모순을 풀지 못한다. 정리 결정의 피로를 사람으로 분리했을 뿐이라 와일드카드로만 둔다.\n\n## 4. 평가표\n\n| 후보 | 참신도 | 이상성 | 실현성 |\n|---|---|---|---|\n| 사용 기록으로 자리 재설계 (추천 1) | 4 | 4 | 5 |\n| 놓을 면을 작업 때만 존재 (추천 2) | 4 | 5 | 3 |\n| 분류 없이 통째 쓸어 담기 (추천 3) | 3 | 4 | 5 |\n| 남의 책상과 교환 정리 (와일드카드) | 4 | 3 | 3 |\n| 작업 자리 매트만 관리, 밖은 자유 | 3 | 4 | 5 |\n| 자주 안 쓰는 물건은 다른 방에 | 3 | 3 | 4 |\n| 체류 3일 날짜 스티커 | 2 | 3 | 4 |\n| 상판을 일부러 작게 | 3 | 3 | 3 |\n| 같은 규격 상자·색으로 통일 | 3 | 3 | 4 |\n| 물건 실루엣 프린트 | 2 | 3 | 4 |\n\n## 5. 부록\n\n### 금지 목록 (뻔한 답)\n1. 정리 습관 들이기, 매일 5분 정리 2. 수납함·서랍 정리함 추가 3. 물건 줄이기(미니멀) 4. 하루 끝 알람·리셋 루틴 5. 정리 앱·챌린지 인증 6. 선반·모니터암으로 공간 확보 7. 종이 스캔해서 없애기 8. 정리 서비스 고용\n\n### 발산 로그 (원리 태그별)\n스윕(5개 방향 × 2개, 끌리지 않는 원리부터 배정):\n- #1 [2 추출] 잠깐 내려놓는 물건만 벽의 임시 착지 선반에 — 임시 보관 장소 분리 (수납 변형)\n- #2 [31 다공질] 상판 일부를 경사·틈으로 — 놓인 물건이 중력으로 한 곳에 모임\n- #3 [6 범용성] 다용도 물건으로 개수 줄이기 — 물건 수 감소 (변형)\n- #4 [33 동질성] 올라오는 물건을 같은 상자·같은 색 파일로 통일 — 시각적 균질화로 흐트러져 보이지 않게\n- #5 [19 주기적 작용] 물건마다 날짜 스티커, 3일 넘으면 격리 상자로 — 시간 기반 강제 퇴출\n- #6 [21 서두르기] 내려놓는 3초를 던져넣기 한 동작으로 — 수납 변형\n- #7 [22 전화위복] 어질러짐 사진을 사용 기록으로 — 측정으로 자리 배정\n- #8 [27 값싼 일회용] 크래프트지로 덮고 종이째 쓸어 담기 — 분류 비용 제거\n- #9 [32 색·투명도] 상판 가장자리를 빨강으로 — 가려지면 티 남 (알림 변형)\n- #10 [36 상전이] 접이식 벽 상판, 접으려면 비워야 함 — 면이 시간에만 존재\n\n극단화(거꾸로 하기, 당연한 전제 뒤집기, 크기·시간 0/∞, 먼 분야 유추 사용):\n- #11 [크기 작게] 상판을 일부러 작게 — 물리적 용량 상한\n- #12 [크기 0/수평면 없앰] 수평면 제거 — #2와 같은 메커니즘으로 묶음\n- #13 [거꾸로: 꺼내기 어렵게] 안 쓰는 물건은 다른 방에 — 접근 경로에 마찰\n- #14 [전제 \"누가\"] 남의 책상과 교환 정리 — 소유 판단 제거\n- #15 [전제 \"왜\"] 목표를 정돈에서 \"3분 안에 작업 재개\"로, 작업 매트 안만 관리 — 성공 기준 재정의\n- #16 [먼 분야: 연극 소품 테이블] 상판에 물건 실루엣 프린트 — 빈 자리로 제자리 인식 (습관 변형)\n- #17 [전제 \"언제\"] 어지르는 시간대(예: 오후 3~5시)만 허용 — 시간 분리 (루틴 변형)\n- #18 [먼 분야: 물류 크로스도킹] 우편·서류는 책상에 착륙시키지 않고 받는 즉시 처리 — 입구 통제\n\n스윕 SKIP: 없음(10개 원리 모두 아이디어가 나옴). 억지로 낸 것은 #3, #6, #9로 변형 판정.\n\n### 다리 놓기 (가장 황당한 3개)\n- #2 경사 책상 → 핵심 메커니즘: 물건이 머무를 평평한 면이 없으면 쌓이지 않는다 → 현실 버전: 접이식/임시 작업판 (추천 2)\n- #8 종이째 쓸어 담기 → 핵심: 정리에서 분류 비용을 빼고 뒤로 미룬다 → 현실 버전: 종이 한 장 + 상자 하나 (추천 3)\n- #14 남의 책상 정리 → 핵심: 내 것이라는 소유 판단이 정리를 막는다 → 현실 버전: 금요일 30분 교환 (와일드카드)\n\n### 후보별 유사도 검사 (가장 비슷한 무난한 답 / 작동 원리가 다른 점)\n- 추천 1: 정리함에 넣기 / 정리함은 넣을 곳을 정하고, 이건 쓴 기록으로 남길 물건을 정한다\n- 추천 2: 선반·서랍 늘리기 / 놓을 자리를 늘리는 대신 놓을 면이 사라진다\n- 추천 3: 종류별 정리 / 분류 자체를 정리 시점에서 사용 시점으로 미룬다\n- 와일드카드: 스스로 정리 / 소유 판단을 하는 사람을 바꾼다\n- 매트만 관리: 구역 나눠 정리 / 목표를 정돈에서 작업 재개 시간으로 바꾼다 (참신도 3)\n- 다른 방에: 물건 줄이기 / 물건은 그대로 두고 책상까지 오는 경로에 마찰을 더한다 (수납 변형 가까움, 3)", "B": "# 책상이 3일 만에 원상복구되는 문제, 습관 말고 \"구조\"로 풀기\n\n## 가정\n- 책상은 작업용(업무/공부)이고, 물건이 쌓이는 주된 원인은 \"제자리가 없거나 제자리까지 가는 게 귀찮아서\"라고 가정합니다.\n- 의지·습관에 기대지 않고, 환경과 구조를 바꾸는 방법만 다룹니다.\n\n## 핵심 진단\n정리를 해도 3일이면 돌아온다는 건 의지 문제가 아니라 시스템 문제입니다. 물건이 책상에 \"들어오는 속도\"가 \"나가는 속도\"보다 빠르고, 되돌리는 비용(마찰)이 올려두는 비용보다 크기 때문입니다. 그래서 정리를 잘하는 법이 아니라 다음 셋을 바꿉니다.\n1. 책상에 올라오는 물건의 양\n2. 되돌리는 비용\n3. 어질러짐을 감지하는 방식\n\n## 방법들\n\n### 1. 책상의 역할을 줄인다 (입구 차단)\n- 책상 위 \"허용 목록\"을 정합니다. 예: 노트북, 모니터, 컵 하나, 램프 정도. 나머지는 원래 자리가 책상이 아닌 물건입니다.\n- 쌓이는 물건의 종류를 3일간 사진으로 찍어 보세요. 대부분 우편물, 영수증, 충전기, 컵, 택배 상자 같은 \"임시 체류자\"입니다. 종류가 파악되면 각각의 출구를 만들 수 있습니다.\n\n### 2. 임시 체류자를 위한 공식 \"착륙장\"을 만든다\n- 책상 옆에 트레이/바구니 하나를 두고 \"일단 여기\"라는 합법적 임시 보관소로 씁니다. 어질러짐은 어차피 생기니, 책상 전체가 아니라 한 곳에만 모이게 하는 겁니다.\n- 주 1회(예: 금요일 퇴근 전) 그 바구니만 비웁니다. 책상 전체 정리가 아니라 바구니 하나 비우기라서 5분이면 끝납니다.\n\n### 3. 되돌리는 마찰을 없앤다\n- 물건마다 \"한 동작\"으로 제자리에 넣을 수 있게 합니다. 뚜껑 열기, 서랍 열기, 지퍼 열기 같은 동작이 하나라도 있으면 올려두게 됩니다.\n  - 뚜껑 없는 오픈 트레이, 벽걸이 훅, 마그네틱 보드, 서랍 대신 열린 선반을 씁니다.\n- 자주 쓰는 물건은 손이 닿는 거리에, 가끔 쓰는 물건은 책상 밖으로 보냅니다.\n\n### 4. 공간 자체를 줄여 \"쌓일 면\"을 없앤다\n- 쌓이는 곳은 평평한 면입니다. 책상 위에 모니터 받침대, 서류 꽂이, 세로형 수납을 두면 물건이 눕지 못합니다.\n- 반대로 책상을 작게 쓰는 방법도 있습니다. 작업 영역을 테이프로 표시해 그 안만 \"비워둘 구역\"으로 정하면 침범이 눈에 보입니다.\n\n### 5. 정리 대신 \"리셋 신호\"에 붙인다\n- 습관을 새로 만들지 말고 이미 있는 행동에 얹습니다. 예: 노트북을 덮으면 = 책상 위 물건을 바구니로 쓸어 담기(30초). 퇴근 알람이 아니라 \"노트북 닫기\"가 트리거입니다.\n- 방식은 정리가 아니라 \"쓸어 담기\"로 정의해 기준을 낮춥니다.\n\n### 6. 들어오는 물건을 줄이는 상류 대책\n- 종이: 우편/영수증은 받는 즉시 사진 찍고 폐기하거나, 아예 전자 수신으로 바꿉니다.\n- 컵/간식: 책상에 가져오지 않는 규칙보다, 컵을 놓을 코스터 위치를 한 곳으로 고정하는 편이 잘 지켜집니다.\n- 새 물건 1개가 들어오면 기존 1개가 나가는 \"1 in 1 out\"를 책상 위에만 적용합니다.\n\n### 7. 어질러짐을 눈에 띄게 만든다\n- 책상 색과 대비되는 매트나 데스크 패드를 깔면 물건이 생기는 순간 눈에 띕니다. 어수선함이 임계점에 닿기 전에 인지됩니다.\n- 매일 같은 시각에 책상 사진을 한 장 찍어두는 것만으로도 \"3일째 되는 날\"의 변화를 스스로 알아챌 수 있습니다.\n\n### 8. 환경을 강제 리셋한다\n- 주 1회 책상 위를 완전히 비우는 날을 정해 청소(먼지 닦기)와 묶습니다. 정리가 아니라 청소가 목적이면 물건을 치울 명분이 자연히 생깁니다.\n- 로봇청소기나 무선청소기를 책상 옆에 세워두면 \"청소하려면 어차피 치워야 한다\"는 압력이 생깁니다.\n\n## 추천 조합 (가장 적은 노력으로)\n1. 3일치 어질러짐 종류를 사진으로 확인합니다.\n2. 책상 옆에 열린 착륙 바구니를 하나 둡니다.\n3. 노트북 닫기 = 바구니로 쓸어 담기를 리셋 신호로 삼습니다.\n4. 주 1회 바구니만 비웁니다.\n\n이 네 가지만 해도 \"큰맘 먹는 정리\"가 필요 없어집니다. 어질러짐을 없애는 게 아니라, 어질러져도 30초 안에 복구되는 구조를 만드는 접근입니다.\n\n## 한계\n- 물건 총량이 책상 크기에 비해 너무 많다면 위 방법으로도 한계가 있습니다. 그땐 먼저 물건 수 자체를 줄이거나 수납 공간을 늘려야 합니다.\n- 위 내용은 일반적인 경험칙이며, 개인 작업 방식에 따라 효과가 다를 수 있습니다."}, {"id": "D2", "domain": "소프트웨어", "problem": "저희 앱은 푸시 알림을 늘리면 재방문은 늘어나는데 알림을 아예 꺼버리는 사용자도 같이 늘어요. 알림을 줄이면 재방문이 떨어지고요. 새로운 접근법이 뭐가 있을까요?", "A": "# 푸시 알림 딜레마: 새로운 접근 후보\n\n## 1. 추천 3안 + 와일드카드\n\n전제(가정): 사용자끼리 연결(친구·팀·팔로우)이 조금은 있고, 앱 안에 \"시간이 지나야 완성되는 것\"(결과·새 소식)이 하나쯤 있다고 보았습니다. 안 맞으면 각 안의 \"안 통하는 조건\"을 보세요.\n\n### 추천 A. 나갈 때 \"다음 부름\"을 사용자가 직접 예약\n- **한 줄 요약:** 앱을 닫기 직전에 \"다음에 무엇이 생기면 알려드릴까요?\"를 딱 한 건 고르게 하고, 그 건만 알림을 보냅니다. 받는 알림이 전부 \"내가 부탁한 것\"이 됩니다.\n- **왜 뻔하지 않은가:** 흔한 답인 '알림 종류별 수신 설정'은 처음에 한꺼번에 골라 두고 잊습니다. 이 안은 매번 구체적인 한 건을 부탁받는 방식이라, 알림이 광고가 아니라 약속 이행으로 읽힙니다.\n- **한계·안 통하는 조건:** 부탁할 만한 \"앞으로 생길 일\"이 없는 앱(늘 같은 콘텐츠)이면 고를 거리가 없습니다. 고르는 게 귀찮아 참여율이 낮으면 재방문 물량도 줄어듭니다.\n- **첫 실험:** 알림 허용 사용자 300명을 무작위로 150/150 나눕니다. 실험군은 종료 화면에 부탁 문구를 넣고, 개발 없이 운영자가 관리 화면에서 수동 예약 발송합니다. 대조군은 지금 방식 그대로입니다. 14일간 봅니다. 성공은 주 1회 이상 방문 비율이 대조군보다 +5%p 이상이면서 알림 끈 비율 차이가 +0.5%p 이하일 때, 실패는 재방문 +2%p 미만입니다. 신청한 사람이 원래 열성적일 수 있으니, 신청 여부와 상관없이 실험군 150명 전체를 비교합니다.\n\n### 추천 B. 앱이 아니라 \"사람\"이 보내는 알림\n- **한 줄 요약:** 앱이 직접 보내는 알림은 최소로 두고, 친구·팀원이 서로에게 \"같이 해요\"를 보내는 버튼을 알림의 주 재료로 씁니다.\n- **왜 뻔하지 않은가:** 흔한 답인 '개인화 타깃팅'은 여전히 앱이 보내는 알림이라 광고처럼 무시됩니다. 이 안은 보내는 쪽이 사람이라, 사용자가 끌 이유가 적은 알림 통로가 하나 더 생깁니다.\n- **한계·안 통하는 조건:** 혼자 쓰는 앱이거나 사용자 간 연결이 없으면 성립하지 않습니다. 사람이 보내는 메시지를 남발하면 스팸 취급을 받습니다.\n- **첫 실험:** 서로 연결된 100쌍을 무작위로 50쌍/50쌍 나눕니다. 실험군은 한쪽이 상대에게 메시지를 보내면 운영자가 수동으로 중계합니다. 대조군은 같은 내용을 앱 명의로 보냅니다. 14일간 봅니다. 성공은 받은 사람의 48시간 내 방문율이 대조군보다 +10%p 이상이고 알림 끈 사람이 늘지 않는 것, 실패는 +3%p 미만입니다. 인기 많은 사용자 몇 명이 결과를 좌우할 수 있으니 한 사람이 받는 메시지는 최대 3건으로 제한합니다.\n\n### 추천 C. \"돌려놓고 나가게\" 만들기\n- **한 줄 요약:** 앱을 나가기 전에 시간이 걸리는 일 하나를 시작시켜 둡니다. 예를 들어 \"내일 아침 ○○ 결과가 나와요\"를 실제로 진행하고, 사용자는 알림 없이도 그 결과가 궁금해서 돌아옵니다.\n- **왜 뻔하지 않은가:** 흔한 답인 '스트릭·포인트 보상'은 안 오면 잃는다는 압박으로 끌어당깁니다. 이 안은 사용자가 시작한 일이 끝나기를 기다리는 마음으로 돌아옵니다.\n- **한계·안 통하는 조건:** 앱에 \"진행 중인 일\"을 만들 만한 기능이 없으면 억지가 됩니다. 결과가 기대에 못 미치면 다음부터 안 돌아옵니다.\n- **첫 실험:** 알림이 꺼져 있거나 미허용인 신규 사용자 400명을 200/200으로 나눕니다. 실험군은 종료 시 \"내일 아침 결과가 준비돼요\"를 보여 주고 결과는 운영자가 손으로 준비합니다. 대조군은 문구 없음입니다. 두 그룹 모두 이 기능의 푸시는 0건입니다. 7일간 봅니다. 성공은 48시간 내 재방문율이 대조군보다 +8%p 이상, 실패는 +3%p 미만입니다. 요일별 방문 차이가 있으니 두 그룹을 같은 요일에 동시에 시작합니다.\n\n### 와일드카드. \"쉬는 동안 쌓아 둘게요\" (방치 이자)\n- **한 줄 요약:** 알림을 끈 사용자에게는 아무것도 보내지 않는 대신, 마지막 방문 때 \"쉬는 동안 놓친 소식을 모아 두었다가 돌아오면 한 번에 정리해 드려요\"라고 약속합니다. 오래 쉴수록 돌아왔을 때 받는 정리가 풍성합니다.\n- **왜 뻔하지 않은가:** 흔한 답인 '스트릭·보상'은 하루라도 빠지면 손해 보는 구조입니다. 이 안은 늦게 와도 손해가 없고 오히려 더 얻는, 압박의 반대 방향입니다. 다만 보상 계열과 가깝다는 점은 인정합니다.\n- **한계·안 통하는 조건:** 쌓아 둘 소식이 별로 없는 앱이면 약속이 빈 말이 됩니다. 이미 떠난 사용자에게는 약속을 본 적이 없어 효과가 없습니다.\n- **첫 실험:** 알림이 꺼진 사용자 400명을 200/200으로 나눕니다. 실험군은 다음 방문 때 보여 줄 \"쉬는 동안 정리\" 화면을 수동으로 만들어 두고, 마지막 방문 때 약속 문구를 보여 줍니다. 대조군은 지금 방식입니다. 30일간 봅니다. 성공은 30일 내 복귀율이 대조군보다 +5%p 이상, 실패는 +1.5%p 미만입니다. 계절·이벤트가 복귀율에 영향을 줄 수 있으니 같은 기간에 동시에 돌립니다.\n\n## 2. 다음 행동\n\n- 비용이 가장 낮은 A(수동 예약 발송)를 먼저 돌립니다. 같은 주에 C도 시작할 수 있습니다(둘은 대상이 겹치지 않게 분리).\n- A·C가 모두 실패 기준이면 결과가 빈약한 것이므로 깊게 모드(40개 원리 전수 스윕)로 다시 돌려 보길 제안합니다.\n\n## 3. 근거: 문제 재정의와 모순\n\n- **기능 문장:** \"사용자가 알림에 시달리지 않으면서도 자기에게 의미 있는 순간에 스스로 앱으로 돌아온다.\" \"왜?\"를 두 번 올려 보면 목표가 \"알림 횟수 조절\"에서 \"돌아올 이유를 알림 밖에서 만든다\"로 넓어져, 이 문장으로 갈아탔습니다.\n- **모순 쌍:**\n  - 기술적 모순(개선하면 다른 게 나빠짐): 알림량이 늘면 재방문은 늘지만 알림을 끄는 사용자도 늘고, 줄이면 그 반대입니다.\n  - 물리적 모순(한 요소가 서로 반대 성질을 요구받음): 알림은 재방문을 위해 많아야 하고, 동시에 차단을 피하려면 적어야 합니다.\n- **이상적 최종결과(IFR, 비용·장치 없이 목적이 저절로 달성된 상태):** 사용자가 알림 없이도 필요한 순간에 스스로 열고, 알림은 사용자가 부탁한 것만 도착합니다.\n- **이미 있는 자원:** 사용자가 앱을 나가는 순간, 사용자 간 관계, 앱이 이미 돌리는 비동기 작업, 안 읽힌 알림 기록과 끈 시점 기록, 쌓이는 미열람 소식, 사용자가 이미 매일 여는 캘린더.\n- **추천안과 모순의 연결:**\n  - A: 조건 분리(부탁한 조건일 때만 알림) 덕에 \"적게 보내면서 재방문은 유지\"가 동시에 성립합니다.\n  - B: 수준 분리(앱 수준은 적게, 사람 사이 수준은 많게)로 풉니다.\n  - C: 시간 분리(앱이 조용한 동안은 진행 중인 일이 대신 부름)로 풉니다.\n  - 와일드카드: 시간 분리(조용한 기간과 몰아서 돌려주는 시점)로 풀지만, 보상 계열과 가까워 와일드카드로 두었습니다.\n- **가정:** 앱 종류를 알 수 없어 위의 전제(사용자 간 연결 약간, 시간이 걸려 완성되는 기능 하나)를 두었습니다. 알림 허용 사용자 수백 명 규모의 실험이 가능하다고 봅니다.\n\n## 4. 평가표 (1~5점)\n\n| 후보 | 참신도 | 이상성 | 실현성 | 비고 |\n|---|---|---|---|---|\n| A 다음 부름 예약 | 3 | 4 | 4 | 추천 |\n| B 사람이 보내는 알림 | 4 | 3 | 3 | 추천 |\n| C 돌려놓고 나가기 | 4 | 4 | 3 | 추천 |\n| 와일드카드 방치 이자 | 3 | 3 | 3 | 보상 계열과 근접 |\n| 알림 예산(주 N장 배분) | 3 | 3 | 3 | 보조(A와 비슷한 사용자 통제) |\n| 캘린더 구독으로 방문일 심기 | 2 | 3 | 4 | 보조(다른 채널 변형) |\n| 습관 앵커 직접 선택 | 2 | 3 | 4 | 보조 |\n| 자동 알림 휴지기 | 1 | 3 | 5 | 보조(빈도 상한 변형) |\n\n## 5. 부록\n\n### 5-1. 흔한 답 (제외 기준)\n1. 발송 빈도 상한(주 N회)\n2. 관심사·행동 기반 개인화 타깃팅\n3. 사용자별 최적 발송 시간대\n4. 알림 종류별 수신 설정(세분화 옵트아웃)\n5. 이메일·문자·카카오톡 등 다른 채널로 대체·병행\n6. 스트릭·포인트·배지 등 보상·게이미피케이션\n7. 홈 위젯·앱 아이콘 배지\n8. 알림 끄려 할 때 \"빈도만 줄일까요?\" 안내\n\n### 5-2. 추천안별 \"가장 비슷한 흔한 답 / 작동 원리가 다른 점\"\n- A: 4번 수신 설정 / 설정은 사전 일괄 선택이고, 이건 건마다 사용자가 직접 발주하여 모든 알림이 요청에 대한 응답이 됨.\n- B: 2번 개인화 타깃팅 / 보내는 주체가 앱이 아니라 사람이라 광고로 분류되지 않음.\n- C: 6번 보상 / 손실 공포가 아니라 사용자가 시작한 일의 결과를 기다리는 마음이 재방문을 만듦.\n- 와일드카드: 6번 보상 / 안 오면 잃는 구조가 아니라 늦게 올수록 더 받는 구조. 그래도 보상 계열이라 경계선.\n\n### 5-3. 발산 로그 (빠르게 모드: 방향 5개 × 원리 2개)\n- #1 [2 추출] 알림 문구를 \"다음 사건 한 줄\"로 축소 — 문구 모양만 다름(변형)\n- #2 [2 추출] 정보 알맹이만 알림, 나머지는 앱 안에서만 공개 — 미끼형 티저\n- #3 [31 다공질] 밤·업무 시간 빈 시간대를 사용자가 표시하고 나머지에만 발송 — 발송 시간대 변형\n- #4 [31 다공질] 종료 화면·로딩 화면의 빈틈에 다음 방문 이유를 채움 — 열린 고리 → C\n- #5 [24 매개체] 사용자가 이미 여는 캘린더에 방문일을 구독 형태로 삽입 — 다른 채널 변형\n- #6 [24 매개체] 친구·팀원을 중개자로 삼음 — 사람 발신 → B\n- #7 [33 동질성] 알림을 메신저 대화 형식으로 통일 — 모양 변형\n- #8 [33 동질성] SKIP(억지: 알림 형식을 통일하는 것 외에 이 문제에 대응되는 발상 없음)\n- #9 [9 사전 반대조치] 끄기 전에 미리 사용자가 알림 휴가를 정하게 함 — 일시정지 변형\n- #10 [34 폐기와 재생] 안 읽힌 알림은 사라지고 다음 알림에 합침 — 묶음 발송(빈도 변형)\n- #11 [22 전화위복] \"알림 끔\"을 신호로 삼아 끈 사람에게만 다른 경로 제공 — 방치 이자 → 와일드카드\n- #12 [22 전화위복] 무시된 알림을 \"원치 않음\" 라벨로 자동 학습 — 개인화 변형\n- #13 [8 무게 보상] 알림 1건마다 사용자에게 돌려주는 가치 1건을 동봉 — 보상 변형\n- #14 [8 무게 보상] 알림 부담을 사용자가 주 N장 예산으로 배분해 상쇄 — 알림 예산(보조)\n- #15 [32 색·투명도] 알림을 무음·무배지로 두고 앱 안 상태만 색으로 표시 — 배지·위젯 변형\n- #16 [36 상전이] SKIP(알림에 \"전환점\" 개념을 억지로 대응해야 함)\n- #17 [극단화: 비용 ∞] 알림 1건이 아주 비싸다고 가정 — 알림 예산\n- #18 [극단화: 시간 ∞] 사용자가 영원히 안 와도 기다림 — 방치 이자\n- #19 [극단화: 알림 0개] 앱은 부르지 않고 사용자가 앱을 호출 — 다음 부름 예약 → A\n- #20 [전제 뒤집기: 누가 보내나] 앱 대신 사람이 보냄 — B\n- #21 [전제 뒤집기: 언제 정하나] 앱이 아니라 사용자가 정함 — A\n- #22 [먼 분야 유추: 도서관 예약 대기] 원하는 책이 들어오면 알림 — A\n- #23 [먼 분야 유추: 방치형 게임] 자리를 비운 시간만큼 복귀 때 몰아줌 — 와일드카드\n- #24 [먼 분야 유추: 오븐 타이머] 반죽을 넣어 두고 나가면 시간이 되어 돌아옴 — C\n\n### 5-4. 다리 놓기 (가장 황당한 3개)\n- #19 \"앱이 알림을 못 보내고 사용자가 앱을 호출한다\" → 핵심 메커니즘: 재방문 사유를 사용자가 직접 발주 → A\n- #17 \"알림 1건이 아주 비싸다\" → 핵심 메커니즘: 희소성이 알림의 무게를 키움 → 알림 예산(보조)\n- #20 \"앱이 아니라 사람이 손으로 보낸다\" → 핵심 메커니즘: 발신자 신뢰 → B", "B": "# 푸시 알림 딜레마: 새로운 접근법\n\n## 가정\n- 재방문 증가와 알림 차단 증가는 같은 \"알림 양\"에서 나오는 상충 관계로 본다.\n- 알림은 현재 모든 사용자에게 비슷한 빈도와 내용으로 나간다고 가정한다.\n- 알림이 사용자에게 가치 있는지 여부(관련성)가 차단의 핵심 원인이라고 본다.\n\n## 핵심 진단\n\"많이 보내면 재방문은 늘지만 차단도 늘고, 적게 보내면 차단은 줄지만 재방문도 준다\"는 것은 알림 횟수를 유일한 조절 변수로 보기 때문에 생기는 딜레마다. 재방문을 만드는 것은 알림 횟수가 아니라 알림이 지금 이 사람에게 유용한 순간이다. 아래 접근법은 횟수 대신 다른 축을 바꿔서 이 상충을 푸는 방향이다.\n\n## 접근법\n\n### 1. 사용자별로 빈도를 나눈다 (분리)\n- 전체 평균 빈도 대신 개인별 빈도 상한을 둔다. 반응이 좋은 사용자는 더 보내고, 반응이 낮아지는 사용자는 자동으로 줄인다.\n- 최근 N회 알림의 무시율이 오르면 \"피로도 점수\"로 감쇠시키는 빈도 제한(frequency capping)을 건다.\n- 사용자가 직접 고르게 한다. 알림 종류·시간대·빈도를 선택하는 설정 센터를 제공한다.\n\n### 2. 시점을 바꾼다 (시간 분리)\n- 사용자별 활성 시간대(과거 열람 패턴)에 맞춰 발송한다.\n- 앱 안에서 사용자 행동 직후, 또는 실제 이벤트(주문 상태 변화, 친구 활동, 가격 변동)가 있을 때만 보낸다. 정기 발송보다 이벤트 기반이 차단율이 낮다.\n- 첫 몇 주는 적게, 신뢰가 쌓인 뒤 점진적으로 늘린다.\n\n### 3. 알림 자체를 대체하거나 묶는다 (통합·대체)\n- 여러 알림을 하루 1회 다이제스트로 묶는다.\n- 조용한 채널을 함께 쓴다. 앱 내 알림함, 이메일, 홈 화면 위젯, 배지 카운트, 잠금화면 라이브 액티비티 등은 차단 위험이 낮다.\n- 푸시는 \"정말 중요한 것\"에만 쓰고 나머지는 사용자가 들어왔을 때 보이게 한다.\n\n### 4. 알림의 성격을 바꾼다 (비용을 가치로 전환)\n- 알림 하나하나가 그 자체로 쓸모 있게 만든다. 알림에서 바로 완료할 수 있는 액션(답장, 승인, 담기)이나 핵심 정보를 본문에 담아 앱을 열지 않고도 가치를 얻게 한다. 재방문이 줄 수 있어도 차단은 크게 줄어든다.\n- 사용자가 좋아하는 것(구독한 주제, 팔로우한 사람, 관심 상품)에 한정한다.\n\n### 5. 차단이 일어나기 직전에 완충한다 (사전 예방)\n- 차단 전 신호(연속 무시, 알림 설정 화면 진입)가 보이면 빈도를 낮추거나 \"덜 받기\" 옵션을 먼저 제안한다. 전부 끄기 대신 \"주 1회만 받기\", \"이번 주 쉬기\"를 선택지로 준다.\n- 시스템 권한 요청은 가치를 체험한 뒤에 한다. 첫 실행 때 묻지 않고 맥락 있는 순간에 요청하면 허용률과 유지율이 높다.\n\n### 6. 재방문 동기를 알림 밖에서도 만든다 (근본 대안)\n- 알림에 의존하지 않는 습관 루프(스트릭, 저장된 진행 상황, 예약된 콘텐츠, 이메일·위젯)를 늘려 알림 의존도 자체를 낮춘다.\n- 알림을 끈 사용자를 별도 코호트로 보고 그들만의 재방문 장치를 둔다.\n\n## 실행 순서 제안 (작게 검증)\n1. 현재 데이터로 알림 종류별 \"재방문 기여 vs 차단 유발\"을 분해한다. 어떤 알림이 차단을 주로 만드는지가 먼저다.\n2. 개인별 빈도 상한과 이벤트 기반 발송을 A/B 테스트한다.\n3. 성공 지표는 재방문율 단독이 아니라 \"재방문 증가분 대비 차단률 증가분\"과 30일 후 알림 허용 유지율로 잡는다.\n4. 효과가 확인되면 설정 센터와 대체 채널을 추가한다.\n\n## 요약\n알림을 \"얼마나 자주\"에서 \"누구에게, 언제, 무엇을, 어떤 채널로\"로 바꾸면 재방문과 유지율의 상충이 상당 부분 풀린다. 가장 빠르게 효과를 볼 후보는 개인화된 빈도 상한, 이벤트 기반 발송, 그리고 차단 직전의 \"덜 받기\" 옵션이다."}, {"id": "D3", "domain": "조직·업무", "problem": "10명 팀인데 주간 회의가 1시간 반씩 걸리고 다들 지루해해요. 그런데 회의를 없애면 서로 뭐 하는지 몰라서 중복 작업이 생겨요. 회의를 없애기는 어렵고요. 어떻게 하면 좋을까요?", "A": "# 주간 회의 1시간 반 → 지루하지 않게, 중복 작업은 없게\n\n가정: 소프트웨어·기획 같은 지식 업무 팀이고, 중복 작업은 한 달에 1~2번 생긴다고 봤습니다. 대면/원격은 가리지 않는 안만 골랐습니다. 회의는 유지합니다. 사용자가 모드를 말하지 않아 빠르게 모드로 진행했습니다.\n\n## 1. 추천 3안 + 와일드카드\n\n### 안 1. \"동료 예측 맞히기\" — 놀라운 것만 회의에서 말한다\n- **요약:** 회의 전에 각자 동료 2명이 \"이번 주에 뭘 할지\"를 한 줄씩 예상해 적습니다. 회의에서는 예상이 빗나간 것과 예상이 겹친 것만 이야기합니다. 예상대로인 일은 그냥 넘어갑니다.\n- **왜 뻔하지 않은가:** 흔한 답인 \"안건을 줄이자\"나 \"미리 보고서를 읽고 오자\"는 발표하는 사람이 자기 일을 다 말하는 구조를 그대로 둡니다. 이 안은 이미 다 아는 정보를 말하지 않게 만듭니다. 예상이 틀렸다는 것 자체가 \"서로 뭐 하는지 모른다\"는 신호라서, 꼭 나눠야 할 정보만 남습니다. 게임처럼 맞히는 재미도 생깁니다.\n- **한계·안 통하는 조건:** 하는 일이 매주 거의 같은 팀은 예상이 전부 맞아서 회의가 텅 빕니다. 그 경우는 오히려 회의를 줄여도 된다는 뜻이긴 하지만, 신규 착수 일은 예상할 수 없어서 놓칠 수 있습니다.\n- **첫 실험:** 10명 전원이 2주(회의 2번) 동안 종이나 공용 시트에 예상을 적습니다. 비교 대상은 지금 방식으로 한 이번 주 회의입니다. 성공: 회의 시간이 45분 이하이고, 5점 척도 \"지루함\" 평균이 지금보다 1점 이상 낮으며, 회의 뒤 일주일 안에 발견된 중복 작업이 0건입니다. 실패: 시간이 60분을 넘거나 중복이 1건이라도 생깁니다. 결과를 흐릴 요인은 그 주의 안건량이 다르다는 점이라서, 안건 개수도 함께 기록합니다.\n\n### 안 2. \"옆 사람 일 대신 발표하기\"\n- **요약:** 각자 자기 일을 말하지 않고, 지정된 동료(돌아가며 짝) 일을 대신 30초씩 발표합니다. 당사자는 틀린 부분만 정정합니다.\n- **왜 뻔하지 않은가:** 흔한 답인 \"발언 시간을 제한하자\"는 여전히 남의 발표를 멍하니 듣게 합니다. 이 안은 내 차례에 남의 일을 말해야 하므로, 미리 그 동료의 일을 알아 두지 않으면 안 됩니다. 듣는 태도가 저절로 바뀌고, 이해가 틀린 곳은 그 자리에서 드러납니다.\n- **한계·안 통하는 조건:** 짝이 준비를 안 하면 정정만 길어질 수 있습니다. 서로 일을 잘 모르는 팀이면 첫 회는 오히려 더 오래 걸립니다.\n- **첫 실험:** 10명이 2주간 짝을 뽑아 진행합니다. 비교 대상은 첫 주에 지금 방식으로 한 회의입니다. 성공: 당사자가 \"거의 맞다\"고 확인한 비율이 70% 이상이고, 회의 후 \"동료들 일을 파악하고 있다\"는 5점 척도가 지금보다 1점 이상 높으며, 회의는 60분 이하입니다. 실패: 정확도 50% 미만이거나 시간이 90분 그대로입니다. 결과를 흐릴 요인은 짝의 친분 차이입니다.\n\n### 안 3. \"이번 주 편집장\" — 한 사람이 전원의 일을 모아 한 장짜리 지도로 만든다\n- **요약:** 매주 한 명이 편집장을 맡아 회의 전 2시간 안에 동료들의 일을 짧게 물어보고, 종이 한 장(누가 어느 영역에서 무엇을 하는지, 겹칠 것 같은 곳 표시)으로 정리합니다. 회의는 이 한 장을 보고 겹침·빈틈만 정리합니다. 편집장이 아닌 사람은 \"지도 정정과 충돌 해결\"만 하면 됩니다.\n- **왜 뻔하지 않은가:** 흔한 답인 \"각자 상태를 공용 문서에 적자\"는 10명이 각자 쓰고 각자 읽는 구조라, 아무도 전체를 못 봅니다. 이 안은 한 사람이 전체를 대신 듣고 하나로 합쳐, 나머지 9명의 듣는 시간을 지도 1장 읽는 시간으로 바꿉니다.\n- **한계·안 통하는 조건:** 편집장 역량에 따라 품질이 흔들리고, 그 주 편집장은 시간을 씁니다. 10주에 한 번 돌아오는 부담이 크면 지도가 대충 만들어집니다.\n- **첫 실험:** 2주 동안 서로 다른 두 사람이 편집장을 맡습니다. 종이 한 장이면 충분합니다. 비교 대상은 지금 방식의 직전 주 회의입니다. 성공: 편집장의 소요 시간이 2시간 이하이고, 회의가 45분 이하이며, 지도에서 겹침 후보가 주당 1건 이상 발견됩니다. 실패: 소요 3시간 초과 또는 겹침 후보 0건이 두 주 연속입니다. 결과를 흐릴 요인은 편집장 개인 역량이라서, 서로 다른 두 사람으로 봅니다.\n\n### 와일드카드. \"일 구역 지도\" — 같은 구역엔 한 명만\n- **요약:** 팀 일을 10개 안팎의 구역으로 나누고 각 구역에 주 담당자를 정해 벽이나 문서에 붙입니다. 새 일이 생기면 구역 담당자만 착수합니다. 중복이 생길 틈 자체를 줄이는 방식입니다.\n- **왜 뻔하지 않은가:** 흔한 답들은 \"서로 뭐 하는지 더 잘 알게 하자\"입니다. 이 안은 다 알 필요 없게 만듭니다. 구역 밖 일은 알아야 할 사람이 담당자 한 명뿐이 됩니다.\n- **한계·안 통하는 조건:** 담당자 한 명에게 일이 쏠려 병목이 되고, 협업이 잦은 팀이면 구역 경계가 계속 흔들립니다. 그래서 추천이 아니라 와일드카드로 뒀습니다.\n- **첫 실험:** 팀 전원이 종이 한 장으로 구역을 그리고 4주 진행합니다. 비교 대상은 지난 4주의 중복 작업 건수입니다. 성공: 중복이 지난 4주 평균보다 50% 이상 줄고, 구역 분쟁 조정이 주 2건 이하입니다. 실패: 중복이 그대로이거나 조정이 주 4건 이상입니다. 결과를 흐릴 요인은 그 기간 프로젝트 성격이 바뀌는 것입니다.\n\n## 2. 다음 행동\n1. 이번 주 회의에서 안 1(예측 맞히기)부터 종이로 시험해 보세요. 준비가 제일 적습니다.\n2. 2주 뒤 결과가 빈약하면 안 2나 안 3으로 바꾸거나, 깊게 모드로 40개 방향을 모두 훑어 후보를 늘릴 수 있습니다.\n\n## 3. 근거: 문제 재정의와 모순\n- **기능 문장:** 10명이 서로 무엇을 하는지 안 채로 일하게 하되, 각자에게 드는 시간과 지루함은 최소로 한다. (\"왜?\"를 두 번 올리면 \"중복 없이 일이 흘러가게 한다\"인데, 회의 유지가 전제라 같은 방향에서 풀었습니다.)\n- **모순:** 전원이 같은 정보를 알아야 하고(동기화), 동시에 각자는 관계없는 정보를 듣지 않아야 한다(지루함). 물리적 모순(하나의 것이 서로 반대의 조건을 동시에 만족해야 하는 문제)입니다. 분리 방식(반대 조건을 시간·공간·조건·수준으로 나눠 푸는 방법) 중 조건 분리를 주로 썼습니다.\n- **IFR(이상적 최종결과, 장치·비용 없이 목적이 저절로 달성되는 상태):** 아무도 따로 시간을 안 쓰는데 모두가 무엇이 겹치는지 안다.\n- **추천안과의 연결:**\n  - 안 1: 조건 분리. 놀라운 정보일 때만 말하고, 예상대로인 정보는 말하지 않는다.\n  - 안 2: 수준 분리. 발표 주체와 정보 소유자를 나눠 청취를 강제한다.\n  - 안 3: 수준 분리. 한 명의 중계자가 전체를 흡수하고 나머지는 압축본만 본다.\n  - 와일드카드: 모순을 푼다기보다 문제 자체를 줄이는 안이라 와일드카드로 밝힙니다.\n- **무난한 답과의 메커니즘 비교 (가장 비슷한 답 / 작동 원리가 다른 점):**\n  - 안 1: 안건 줄이기 / 정보를 예측 오차로 걸러 낸다.\n  - 안 2: 발언 시간 제한 / 남의 일을 말해야 하므로 청취가 강제된다.\n  - 안 3: 공용 문서 상태 업데이트 / 한 사람이 합성해 지도 하나로 만든다.\n  - 와일드카드: 칸반 보드로 공유 / 공유가 아니라 구획으로 중복 자체를 막는다.\n\n## 4. 평가표\n| 안 | 참신도 | 이상성 | 실현성 |\n|---|---|---|---|\n| 안 1 예측 맞히기 | 4 | 4 | 5 |\n| 안 2 옆 사람 대신 발표 | 3 | 3 | 4 |\n| 안 3 이번 주 편집장 | 3 | 4 | 3 |\n| 와일드카드 일 구역 지도 | 4 | 3 | 2 |\n\n## 부록\n\n### 금지 목록 (뻔한 답)\n1. 안건을 줄이고 회의를 45분으로 단축\n2. 회의 전에 각자 공용 문서·슬랙에 상태를 적어 두기\n3. 발언 시간 제한(스탠드업식)\n4. 칸반 보드·노션으로 진행 현황 공개\n5. 격주 또는 팀을 나눈 소그룹 회의\n6. 회의를 녹화해 필요한 사람만 나중에 시청\n\n### 발산 로그 (빠르게 모드: 5개 방향 × 2)\n- #1 [원리 10 사전 조치] 회의 전 동료 예상 적기 — 예측 오차로 정보 선별\n- #2 [원리 10 사전 조치] 착수 전 \"이거 시작함\" 한 줄 예고 — 착수 시점에 충돌 차단(변형: 칸반)\n- #3 [원리 24 매개체] 편집장이 중계해 한 장짜리 지도 작성 — 한 사람이 합성\n- #4 [원리 24 매개체] 팀 리더가 모든 일을 배정 — 중앙 집중(무난)\n- #5 [원리 5 결합] 남의 일을 대신 발표 — 청취 강제\n- #6 [원리 5 결합] 회의 + 점심을 붙여 말 늘어남 방지 — SKIP(중복 문제와 무관)\n- #7 [원리 1 분할] 일 구역으로 쪼개기 — 구획으로 중복 방지\n- #8 [원리 1 분할] 팀을 5명씩 두 회의로 — 소그룹(금지 목록 변형)\n- #9 [원리 15 동적성] 회의마다 진행 방식 순환 — SKIP(중복 감소와 직접 연결 약함)\n- #10 [원리 15 동적성] 편집장 역할 순환 — 부담 분산\n- 극단화 1 (시간 0): 회의 0분이라면? — 회의 직전 1분씩 서로 화면 공유로 대체(변형)\n- 극단화 2 (거꾸로): 중복을 없애지 말고 중복이 나도 손해 안 나게 — 중복 작업 결과를 합치는 규칙, 다리 놓기 후 \"겹침 표식\"으로 흡수\n- 극단화 3 (먼 분야 유추, 신문사): 편집장이 지면을 짠다 — 안 3의 원형\n- 극단화 4 (먼 분야 유추, 항공관제): 이륙 전 슬롯 예약 — 착수 전 예약 후 충돌만 조정(변형: 칸반)\n- 극단화 5 (뒤집기): 자기 일 발표 대신 남이 말한다 — 안 2와 동일", "B": "# 10명 팀 주간 회의 개선안\n\n## 가정\n- 회의의 진짜 목적은 \"서로 뭐 하는지 공유해서 중복 작업을 막는 것\"이다.\n- 지루한 이유는 대부분의 내용이 나와 무관한 순차적 상태 보고(10명 x 5~6분)이기 때문이다.\n- 팀은 Slack/Teams, Jira/Notion/스프레드시트 같은 도구를 이미 쓰고 있다.\n- 회의 자체는 유지한다(없애기 어려움).\n\n## 핵심 아이디어\n\"정보 공유\"와 \"논의/결정\"을 분리한다. 공유는 비동기로 회의 전에 끝내고, 회의 시간은 사람이 모여야만 가능한 일에만 쓴다.\n\n## 구체적 방안\n\n1. **회의 전 비동기 현황판 (중복 방지의 핵심)**\n   - 공용 문서/보드에 각자 3줄만 적는다: 이번 주 할 일 / 진행 중 / 막힌 것. 회의 하루 전까지 작성.\n   - 중복 작업은 회의가 아니라 이 현황판을 읽으면 드러난다. 새 작업 시작 전 현황판을 먼저 확인하는 규칙을 둔다.\n\n2. **회의는 예외 중심으로**\n   - 현황 낭독은 하지 않는다. 사전에 읽고 왔다고 전제한다.\n   - 안건은 (a) 겹치거나 충돌하는 작업, (b) 막힌 것, (c) 결정이 필요한 것만.\n   - 진행자가 현황판에서 겹침/막힘을 미리 표시해 두면 회의가 \"문제 있는 항목\"만 다룬다.\n\n3. **시간을 줄이고 구조를 바꾼다**\n   - 60분 -> 25~30분으로 단축(파킨슨 법칙: 시간이 있으면 채워진다).\n   - 타이머와 진행자 역할을 돌아가며 맡는다.\n   - 관련 있는 사람끼리만 남는 \"브레이크아웃\" 구간을 둔다. 나머지는 퇴장 가능.\n\n4. **10명을 쪼개기**\n   - 2~3개 하위 그룹(예: 3~4명)이 짧게 각자 싱크하고, 그룹 대표가 전체 회의에서 요약만 전달한다.\n   - 전체 회의는 격주로 하고 사이 주는 그룹 싱크만 하는 방법도 있다.\n\n5. **중복 방지 장치를 회의 밖에도 둔다**\n   - 작업 시작 시 채널에 \"OO 시작합니다\" 한 줄 공지.\n   - 작업 카드에 담당자 필수 지정.\n   - 주 1회 5분 \"중복 스캔\"(진행자가 비슷한 제목의 카드를 훑음).\n\n6. **지루함 자체를 다루기**\n   - 매번 한 명이 5분 데모/배운 점을 공유(순환).\n   - 회의 끝에 \"이번 회의가 유용했나\" 1~5점 투표로 지속 개선.\n\n## 추천 단계적 도입\n- 1~2주차: 현황판 + 25~30분 회의만 시범 적용.\n- 3~4주차: 회의 유용도 점수와 중복 발생 건수를 비교해 조정.\n- 이후: 점수가 높고 중복이 줄면 격주 전체 회의 + 그룹 싱크로 전환 검토.\n\n## 기대 효과와 주의점\n- 회의 시간 절반 이상 절감, 중복 작업은 오히려 감소(상시 가시성).\n- 주의: 현황판이 안 채워지면 무너진다. 작성 5분 이내로 가볍게 유지하고, 진행자가 미작성자를 회의 전날 리마인드한다."}]</script>

<script>
(function(){

];

var ft; function flash(t){ var el=document.getElementById('saved'); el.textContent=t; clearTimeout(ft); ft=setTimeout(function(){el.textContent='';},1800); }
function md(s){ try{ return window.marked ? window.marked.parse(s,{gfm:true,breaks:false}) : '<pre>'+esc(s)+'</pre>'; }catch(e){ return '<pre>'+esc(s)+'</pre>'; } }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function cur(){ var p=PAIRS[state.idx]; if(!state.ans[p.id]) state.ans[p.id]={winner:null,r:{A:{},B:{}},c:''}; return state.ans[p.id]; }
function isDone(id){ var a=state.ans[id]; if(!a||!a.winner) return false; for(var i=0;i<CRIT.length;i++){ if(!a.r.A[CRIT[i].id]||!a.r.B[CRIT[i].id]) return false; } return true; }

  var n=doneCount(); document.getElementById('pcount').textContent=n+'/'+PAIRS.length+' 완료';
  document.getElementById('pbar').style.width=(100*n/PAIRS.length)+'%';
}

function render(){

  var tabs=el('div','tabs-m'); ['A','B'].forEach(function(k){

  v.appendChild(cols);

  var ev=el('section','eval');
  ev.innerHTML='<h3>1. 어느 쪽이 더 도움이 되나요?</h3>';

  [['A','답안 A'],['B','답안 B'],['tie','비슷함']].forEach(function(o){
    var b=el('button','pick'); b.type='button'; b.dataset.v=o[0]; b.textContent=o[1]; b.setAttribute('aria-pressed',String(a.winner===o[0]));
    b.onclick=function(){ a.winner=o[0]; save(); render(); }; w.appendChild(b); });
  ev.appendChild(w);
  var hint=el('p','hint'); hint.textContent='읽은 느낌 그대로 고르세요. 길이가 아니라 내 문제에 실제로 쓸모 있었는지가 기준입니다.'; ev.appendChild(hint);

  var h2=el('h3'); h2.textContent='2. 항목별 별점 (1 = 아쉬움, 5 = 매우 좋음)'; ev.appendChild(h2);
  var t=el('table','rtable'); var thead='<tr><th>항목</th><th>답안 A</th><th>답안 B</th></tr>'; t.innerHTML='<thead>'+thead+'</thead>';
  var tb=el('tbody');
  CRIT.forEach(function(cr){
    var tr=el('tr'); var td0=el('td','crit'); td0.innerHTML=esc(cr.t)+'<small>'+esc(cr.s)+'</small>'; tr.appendChild(td0);
    ['A','B'].forEach(function(k){
      var td=el('td',k+'-col'); var st=el('div','stars');
      for(var n=1;n<=5;n++){ (function(n){
        var b=el('button','st'); b.type='button'; b.textContent=n; b.setAttribute('aria-label',cr.t+' 답안 '+k+' '+n+'점');
        b.setAttribute('aria-pressed',String(a.r[k][cr.id]===n));
        b.onclick=function(){ a.r[k][cr.id]=n; save(); render(); }; st.appendChild(b); })(n); }
      td.appendChild(st); tr.appendChild(td); });
    tb.appendChild(tr); });
  t.appendChild(tb); ev.appendChild(t);

  var h3=el('h3'); h3.textContent='3. 한마디 (선택) — 해보고 싶은 아이디어, 이상했던 점 등'; ev.appendChild(h3);
  var ta=el('textarea'); ta.value=a.c||''; ta.setAttribute('aria-label','코멘트');
  ta.oninput=function(){ a.c=ta.value; save(); }; ev.appendChild(ta);

  var nav=el('div','nav');
  var prev=el('button','btn'); prev.type='button'; prev.textContent='← 이전'; prev.disabled=state.idx===0;
  prev.onclick=function(){ state.idx--; save(); render(); window.scrollTo({top:0}); };
  var next=el('button','btn primary'); next.type='button';
  var last=state.idx===PAIRS.length-1;
  next.textContent=last?'결과 보기':'다음 →';
  next.disabled=!isDone(p.id);
  next.title=isDone(p.id)?'':'승자 선택과 8개 별점을 모두 채우면 넘어갈 수 있어요';
  next.onclick=function(){ if(last){ showResult(); } else { state.idx++; save(); render(); window.scrollTo({top:0}); } };
  nav.appendChild(prev); nav.appendChild(next); ev.appendChild(nav);
  v.appendChild(ev);
  if(doneCount()===PAIRS.length) showResult(true); else document.getElementById('result').innerHTML='';
}

function el(tag,cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }

function key(){ try{ return JSON.parse(decodeURIComponent(escape(atob(KEYB64)))); }catch(e){ return null; } }
function cond(pid,slot){ var k=key(); return k&&k[pid]?k[pid][slot]:null; }

function rows(){
  return PAIRS.map(function(p){
    var a=state.ans[p.id]||{r:{A:{},B:{}}};
    var r={id:p.id, domain:p.domain, winner:a.winner, A_is:cond(p.id,'A'), B_is:cond(p.id,'B'), comment:a.c||''};
    ['A','B'].forEach(function(k){ CRIT.forEach(function(c){ r[k+'_'+c.id]=a.r&&a.r[k]?a.r[k][c.id]||'':''; }); });
    r.winner_is = a.winner==='tie'?'tie':(a.winner? cond(p.id,a.winner):'');
    return r; });
}
function download(name,text,type){ var b=new Blob([text],{type:type}); var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},500); }
function toCSV(rs){ if(!rs.length) return ''; var cols=Object.keys(rs[0]); var q=function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return '﻿'+[cols.join(',')].concat(rs.map(function(r){ return cols.map(function(c){return q(r[c]);}).join(','); })).join('\n'); }

function avg(a){ return a.length? (a.reduce(function(x,y){return x+y;},0)/a.length):0; }
function showResult(auto){
  var box=document.getElementById('result'); var rs=rows();
  var wins={skill:0,base:0,tie:0};
  rs.forEach(function(r){ if(r.winner_is==='tie') wins.tie++; else if(r.winner_is==='skill') wins.skill++; else if(r.winner_is==='base') wins.base++; });
  var sc={skill:{},base:{}}; CRIT.forEach(function(c){ sc.skill[c.id]=[]; sc.base[c.id]=[]; });
  rs.forEach(function(r){ ['A','B'].forEach(function(k){ var who=r[k+'_is']; CRIT.forEach(function(c){ var v=r[k+'_'+c.id]; if(v) sc[who][c.id].push(v); }); }); });
  var html='<div class="result"><h2>평가 완료 🎉</h2><div class="saved" style="margin-bottom:8px">이제 정답이 공개됩니다. 아래에서 결과 파일을 저장하세요.</div>';
  html+='<div class="res-grid"><div class="kpi skill"><b>'+wins.skill+'</b><span>스킬 답안이 이긴 문제</span></div><div class="kpi"><b>'+wins.base+'</b><span>스킬 없는 답안이 이긴 문제</span></div><div class="kpi"><b>'+wins.tie+'</b><span>비슷함</span></div></div>';
  html+='<table class="rev"><thead><tr><th>항목</th><th>스킬 평균</th><th>스킬 없음 평균</th><th>차이</th></tr></thead><tbody>';
  CRIT.forEach(function(c){ var s=avg(sc.skill[c.id]), b=avg(sc.base[c.id]); var d=s-b;
    html+='<tr><td>'+esc(c.t)+'</td><td>'+s.toFixed(2)+'</td><td>'+b.toFixed(2)+'</td><td>'+(d>0?'+':'')+d.toFixed(2)+'</td></tr>'; });
  html+='</tbody></table>';
  html+='<table class="rev"><thead><tr><th>문제</th><th>A는</th><th>B는</th><th>내 선택</th></tr></thead><tbody>';
  rs.forEach(function(r,i){ var f=function(x){return x==='skill'?'<span class="badge skill">스킬</span>':'<span class="badge base">스킬 없음</span>';};
    html+='<tr><td>문제 '+(i+1)+' · '+esc(r.domain)+'</td><td>'+f(r.A_is)+'</td><td>'+f(r.B_is)+'</td><td>'+(r.winner==='tie'?'비슷함':f(r.winner_is))+'</td></tr>'; });
  html+='</tbody></table>';
  html+='<div class="nav" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn primary" id="xj" type="button">JSON 저장</button><button class="btn" id="xc" type="button">CSV 저장</button><button class="btn" id="xr" type="button">처음부터 다시</button></div>';
  html+='<p class="hint" style="margin-top:10px">별점은 1~5점이며 4문제 이상이면 경향을 볼 수 있지만, 사람 수가 적으면 우연일 수 있어요. 가능하면 여러 사람이 각자 평가해 파일을 모아 비교하세요.</p></div>';
  box.innerHTML=html;
  document.getElementById('xj').onclick=function(){ download('human-eval-result.json',JSON.stringify(rs,null,2),'application/json'); };
  document.getElementById('xc').onclick=function(){ download('human-eval-result.csv',toCSV(rs),'text/csv;charset=utf-8'); };
  document.getElementById('xr').onclick=function(){ if(confirm('입력한 평가를 모두 지우고 처음부터 다시 할까요?')){ state={idx:0,ans:{}}; save(); render(); window.scrollTo({top:0}); } };
  if(!auto) box.scrollIntoView({behavior:'smooth'});
}

(function theme(){
  var b=document.getElementById('theme'); var root=document.documentElement;
  try{ var t=localStorage.getItem('triz-human-theme'); if(t) root.setAttribute('data-theme',t); }catch(e){}
  b.onclick=function(){ var dark=getComputedStyle(root).getPropertyValue('--bg').trim()==='#10131a'; var n=dark?'light':'dark'; root.setAttribute('data-theme',n); try{localStorage.setItem('triz-human-theme',n);}catch(e){} };
})();

load(); if(state.idx>=PAIRS.length||state.idx<0) state.idx=0; render();
})();
</script>
</body>
</html>
